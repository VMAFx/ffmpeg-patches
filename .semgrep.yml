#
# Semgrep rules of this repository, run by the semgrep job of
# .github/workflows/scanners.yml with --error: any finding fails the job.
# The rules live here, not in the Semgrep Registry, so a run needs no network
# and the rule set changes only with this file.
rules:
  - id: subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      A subprocess started through the shell runs whatever the string expands
      to. Pass an argument list and leave shell at its default.
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: subprocess.$FUNC(..., shell=1, ...)

  - id: subprocess-argv-from-environment
    languages: [python]
    severity: ERROR
    mode: taint
    message: >-
      Environment values must not supply subprocess arguments. Resolve
      executables with shutil.which on PATH or use a fixed allow-list.
    pattern-sources:
      - pattern: os.environ[$KEY]
      - pattern: os.environ.get(...)
      - pattern: os.getenv(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.Popen($ARGV, ...)
              - pattern: subprocess.run($ARGV, ...)
              - pattern: subprocess.call($ARGV, ...)
              - pattern: subprocess.check_call($ARGV, ...)
              - pattern: subprocess.check_output($ARGV, ...)
          - focus-metavariable: $ARGV

  - id: executable-from-environment
    languages: [python]
    severity: ERROR
    message: >-
      executables come from PATH via shutil.which or a fixed allow-list,
      never an environment override.
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
            $X = $ENV
            ...
      - metavariable-pattern:
          metavariable: $ENV
          pattern-either:
            - pattern: os.environ.get(...)
            - pattern: os.getenv(...)
            - pattern: os.environ[$KEY]
      - pattern-inside: |
          def $F(...):
            ...
            shutil.which(...)
            ...
      - pattern: return <... $X ...>

  - id: subprocess-without-timeout
    languages: [python]
    severity: ERROR
    message: >-
      Every subprocess this repository waits for is bounded. Pass timeout=,
      as git() in scripts/series.py does.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.check_output(...)
      - pattern-not: subprocess.$FUNC(..., timeout=$T, ...)

  - id: os-shell-command
    languages: [python]
    severity: ERROR
    message: os.system and os.popen run a string through the shell; use subprocess with an argument list.
    pattern-either:
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: eval-or-exec
    languages: [python]
    severity: ERROR
    message: eval and exec run text as code; parse the text instead.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: pickle-load
    languages: [python]
    severity: ERROR
    message: Unpickling runs code from the data; use json or tomllib.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: tempfile-mktemp
    languages: [python]
    severity: ERROR
    message: tempfile.mktemp returns a name another process can take first; use mkstemp or TemporaryDirectory.
    pattern: tempfile.mktemp(...)

  # Excluded: .config/lefthook/scripts/checkpoint.py (adopted praetor helper;
  # a missing OPEN ledger names no worktrees by design; adopted file is not edited here).
  # Category D, 120 days, expires 2027-03-08.
  - id: oserror-swallowed-as-empty
    languages: [python]
    severity: ERROR
    message: >-
      Propagate or report; never return an empty value from an OSError handler.
    paths:
      include:
        - scripts/
        - tests/
      exclude:
        - /.config/lefthook/scripts/checkpoint.py
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except $EXC:
                  ...
                  return $EMPTY
          - pattern: |
              try:
                  ...
              except $EXC as $E:
                  ...
                  return $EMPTY
          - pattern: |
              try:
                  ...
              except (..., $EXC, ...):
                  ...
                  return $EMPTY
          - pattern: |
              try:
                  ...
              except (..., $EXC, ...) as $E:
                  ...
                  return $EMPTY
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: |
                    try:
                        ...
                    except $EXC:
                        ...
                        $REPORT
                        ...
                        return $EMPTY
                - pattern: |
                    try:
                        ...
                    except $EXC as $E:
                        ...
                        $REPORT
                        ...
                        return $EMPTY
                - pattern: |
                    try:
                        ...
                    except (..., $EXC, ...):
                        ...
                        $REPORT
                        ...
                        return $EMPTY
                - pattern: |
                    try:
                        ...
                    except (..., $EXC, ...) as $E:
                        ...
                        $REPORT
                        ...
                        return $EMPTY
            - metavariable-pattern:
                metavariable: $REPORT
                pattern-either:
                  - pattern: print(..., file=sys.stderr)
                  - pattern: print(..., file=sys.stderr, ...)
                  - pattern: sys.stderr.write(...)
                  - pattern: $LOG.warning(...)
                  - pattern: $LOG.error(...)
                  - pattern: $LOG.exception(...)
                  - pattern: warnings.warn(...)
      - metavariable-regex:
          metavariable: $EXC
          regex: ^(OSError|FileNotFoundError|PermissionError|IsADirectoryError|NotADirectoryError)$
      - metavariable-regex:
          metavariable: $EMPTY
          regex: ^(\[\]|\{\}|\(\)|set\(\)|""|''|0)$

  - id: popen-pipe-wait
    languages: [python]
    severity: ERROR
    message: use communicate() so the pipes are read and closed.
    paths:
      include:
        - scripts/
        - tests/
    patterns:
      - pattern-either:
          - pattern: |
              $P = subprocess.Popen(..., stdout=subprocess.PIPE, ...)
              ...
              $P.wait(...)
          - pattern: |
              $P = subprocess.Popen(..., stderr=subprocess.PIPE, ...)
              ...
              $P.wait(...)
          - pattern: |
              with subprocess.Popen(..., stdout=subprocess.PIPE, ...) as $P:
                  ...
                  $P.wait(...)
          - pattern: |
              with subprocess.Popen(..., stderr=subprocess.PIPE, ...) as $P:
                  ...
                  $P.wait(...)
      - pattern-not:
          pattern-either:
            - pattern: |
                $P = subprocess.Popen(...)
                ...
                $F(..., $P, ...)
                ...
                $P.wait(...)
            - pattern: |
                with subprocess.Popen(...) as $P:
                    ...
                    $F(..., $P, ...)
                    ...
                    $P.wait(...)
            - pattern: |
                $P = subprocess.Popen(...)
                ...
                $F(..., $P.stdout, ...)
                ...
                $P.wait(...)
            - pattern: |
                $P = subprocess.Popen(...)
                ...
                $F(..., $P.stderr, ...)
                ...
                $P.wait(...)
            - pattern: |
                with subprocess.Popen(...) as $P:
                    ...
                    $F(..., $P.stdout, ...)
                    ...
                    $P.wait(...)
            - pattern: |
                with subprocess.Popen(...) as $P:
                    ...
                    $F(..., $P.stderr, ...)
                    ...
                    $P.wait(...)
            - pattern: |
                $P = subprocess.Popen(...)
                ...
                for $L in $P.stdout:
                    ...
                ...
                $P.wait(...)
            - pattern: |
                $P = subprocess.Popen(...)
                ...
                for $L in $P.stderr:
                    ...
                ...
                $P.wait(...)
            - pattern: |
                with subprocess.Popen(...) as $P:
                    ...
                    for $L in $P.stdout:
                        ...
                    ...
                    $P.wait(...)
            - pattern: |
                with subprocess.Popen(...) as $P:
                    ...
                    for $L in $P.stderr:
                        ...
                    ...
                    $P.wait(...)
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: |
                    $P = subprocess.Popen(...)
                    ...
                    $P.stdout.$READ(...)
                    ...
                    $P.wait(...)
                - pattern: |
                    $P = subprocess.Popen(...)
                    ...
                    $P.stderr.$READ(...)
                    ...
                    $P.wait(...)
                - pattern: |
                    with subprocess.Popen(...) as $P:
                        ...
                        $P.stdout.$READ(...)
                        ...
                        $P.wait(...)
                - pattern: |
                    with subprocess.Popen(...) as $P:
                        ...
                        $P.stderr.$READ(...)
                        ...
                        $P.wait(...)
            - metavariable-regex:
                metavariable: $READ
                regex: ^(read|readline|readlines)$

  - id: subtest-cleanup-outside-finally
    languages: [python]
    severity: ERROR
    message: move the cleanup into a finally block so a failed subTest does not leave state for the next one.
    paths:
      include:
        - tests/
    patterns:
      - pattern-inside: |
          with self.subTest(...):
              ...
      - pattern-inside: |
          self.$ASSERT(...)
          ...
      - pattern: $X.$CLEAN(...)
      - metavariable-regex:
          metavariable: $ASSERT
          regex: ^assert
      - metavariable-regex:
          metavariable: $CLEAN
          regex: ^(unlink|rmdir|rmtree|remove|cleanup)$
      - pattern-not-inside: |
          try:
              ...
          finally:
              ...
              $X.$CLEAN(...)
              ...

  # shellcheck does not flag reading $? inside a negated if (pull request 248 review, 2026-11-08).
  # Anchored at line start (no comments or strings); ";" or a newline before then; elif too.
  # Whitespace and whole comments may sit before and after then; a comment naming $? is no read.
  - id: negated-if-status-read
    languages: [generic]
    severity: ERROR
    message: >-
      $? inside "if ! cmd; then" is the status of the negation (0), not of cmd;
      write "if cmd; then rc=0; else rc=$?; fi".
    paths:
      include:
        - "*.sh"
        - /scripts/ffmpeg-forgejo
    pattern-regex: '(?m)^[ \t]*(?:el)?if[ \t]+![ \t][^\n;]*[;\n](?:\s|#[^\n]*\n)*then(?:\s|#[^\n]*\n)+(?:local\s+)?\w+=\$\?'

