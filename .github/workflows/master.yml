#
# Nightly check of the series against FFmpeg master. Submitted patches use
# their recorded upstream PR form, so conflicts fail the run. Consumers stay
# on the pinned release; fixes already in master are reported as drop candidates.
name: series on FFmpeg master

'on':
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  master:
    name: series on FFmpeg master (conflicts · drop candidates)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      FFMPEG_FORGE: https://code.ffmpeg.org/FFmpeg/FFmpeg.git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Load the pinned base
        run: grep -E '^FFMPEG_(REMOTE|TAG|COMMIT)=' base.env >> "$GITHUB_ENV"
      - name: Fetch FFmpeg master and the pinned release
        # The release's blobs let git am --3way rebuild each patch's preimage.
        run: |
          git init -q ffmpeg
          git -C ffmpeg remote add origin "$FFMPEG_REMOTE"
          git -C ffmpeg fetch -q --shallow-exclude="refs/tags/${FFMPEG_TAG}" origin master
          git -C ffmpeg checkout -q --detach FETCH_HEAD
          git -C ffmpeg fetch -q --depth=1 origin "refs/tags/${FFMPEG_TAG}:refs/tags/${FFMPEG_TAG}"
          git -C ffmpeg log -1 --format='FFmpeg master %H %cs %s'
      - name: Apply every patch and report
        run: |
          status=0
          python3 scripts/series.py apply --keep-going ffmpeg \
            --master-forms "$FFMPEG_FORGE" \
            --report "$GITHUB_STEP_SUMMARY" > results.txt || status=$?
          cat results.txt
          while read -r result name; do
            case "$result" in
              conflict) echo "::warning title=Conflict on master::$name" ;;
              upstream) echo "::warning title=Drop candidate::$name is already in master" ;;
              master-form) echo "::warning title=Master form::$name applied as upstream PR head" ;;
            esac
          done < results.txt
          exit "$status"
