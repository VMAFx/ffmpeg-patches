#
# Daily comparison with the FFmpeg forge, read without a token. Repair
# contribution fields and inline master_form commits, then regenerate the
# README table. Publish any changes as upstream-drift.patch and show the
# diff in the job summary before failing the run for human review.
# Unfixed covered_by drift or a tool error also fails, even without a diff.
# No pull request is created; repository permissions remain read-only.
name: upstream drift

'on':
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  drift:
    name: upstream pull requests (drift against code.ffmpeg.org)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Compare every recorded pull request with the forge
        id: drift
        run: python3 scripts/upstream_drift.py --fix
      - name: Prepare the drift patch and job summary
        id: patch
        if: success() || failure()
        run: |
          if git diff --exit-code > /dev/null; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff > upstream-drift.patch
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            {
              echo '### Upstream drift patch'
              echo ''
              echo '```diff'
              cat upstream-drift.patch
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the drift patch
        if: ${{ !cancelled() && steps.patch.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-drift
          path: upstream-drift.patch
          if-no-files-found: error
      - name: Fail when drift needs review or could not be checked
        if: ${{ !cancelled() && (steps.patch.outputs.changed == 'true' || steps.drift.outcome == 'failure') }}
        run: exit 1
