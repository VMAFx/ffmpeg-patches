#
# Reusable release build. It packages the series with `make dist`, writes an
# SPDX SBOM and attests SLSA build provenance in the same job, so this
# workflow's identity signs the attestation, isolated from the caller (SLSA
# Build Level 3). It then signs SHA256SUMS keyless with cosign and uploads
# everything for the caller's publish job. Nothing is downloaded or restored
# from a cache before the attestation. release.yml is the only caller.
#
# A tag is vX.Y.Z or vX.Y.Z-rc.N; the tag step refuses any other shape, and
# the `prerelease` output tells the publish job which kind of release to make.
name: Release build

'on':
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded artefact that holds the release files
        value: ${{ jobs.build.outputs.artifact-name }}
      version:
        description: Version the release files carry in their names
        value: ${{ jobs.build.outputs.version }}
      prerelease:
        description: '"true" for vX.Y.Z-rc.N, "false" for vX.Y.Z, empty without a tag'
        value: ${{ jobs.build.outputs.prerelease }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: release build (dist · SBOM · provenance · cosign)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Release tag shape
        id: tag
        # scripts/release_guard.py holds the rule; tests/test_release_guard.py
        # plants each malformed tag and checks that this step still calls it.
        run: |
          python3 scripts/release_guard.py tag \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Series check
        run: python3 scripts/series.py check
      - name: Package the series
        id: package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          make dist VERSION="$VERSION"
          python3 scripts/series.py notes "$VERSION" "$GITHUB_REPOSITORY" > dist/RELEASE_NOTES.md
          echo "artifact-name=ffmpeg-patches-release-${VERSION}" >> "$GITHUB_OUTPUT"
      - name: SBOM of the release tarball (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/ffmpeg-patches-${{ steps.tag.outputs.version }}.tar.gz
          format: spdx-json
          output-file: dist/ffmpeg-patches-${{ steps.tag.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: dist
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          sha256sum "ffmpeg-patches-${VERSION}.tar.gz" "ffmpeg-patches-${VERSION}.spdx.json" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (SLSA v1.0)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ffmpeg-patches-${{ steps.tag.outputs.version }}.tar.gz
            dist/ffmpeg-patches-${{ steps.tag.outputs.version }}.spdx.json
      - name: Keep the provenance bundle with the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: cp "$BUNDLE" "dist/ffmpeg-patches-${VERSION}.provenance.sigstore.json"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Verify the SHA256SUMS signature
        working-directory: dist
        # cosign verify-blob against this workflow's identity at this ref, then
        # every file SHA256SUMS lists.
        run: |
          python3 ../scripts/release_guard.py verify SHA256SUMS SHA256SUMS.sigstore.json \
            --workflow-of "$GITHUB_REPOSITORY" "$GITHUB_REF"
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: dist/
          if-no-files-found: error
