#
# A v* tag publishes a release after the full series gate passes on the tagged
# commit. A manual run builds, attests and signs the same files but cannot
# publish. A vX.Y.Z-rc.N tag publishes a prerelease that is never "latest".
name: Release

'on':
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    uses: ./.github/workflows/series.yml

  # Build, SBOM, SLSA provenance and cosign signature in the reusable
  # workflow: its identity, not this file's, signs the attestation.
  build:
    needs: gate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    steps:
      # The guards in scripts/release_guard.py, at the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the attested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Publish the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          python3 ../scripts/release_guard.py checksums SHA256SUMS
          python3 ../scripts/release_guard.py publish "$VERSION" "$GITHUB_REF_NAME" "$PRERELEASE"
          kind=()
          if [ "$PRERELEASE" = true ]; then
            kind=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" \
            --title "ffmpeg-patches ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "${kind[@]}" \
            "ffmpeg-patches-${VERSION}.tar.gz" \
            "ffmpeg-patches-${VERSION}.spdx.json" \
            "ffmpeg-patches-${VERSION}.provenance.sigstore.json" \
            SHA256SUMS \
            SHA256SUMS.sigstore.json
          actual="$(gh release view "$VERSION" --json isPrerelease --jq .isPrerelease)"
          python3 ../scripts/release_guard.py published "$PRERELEASE" "$actual"
