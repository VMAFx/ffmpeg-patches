# SPDX-FileCopyrightText: 2026 Lusoris
# SPDX-License-Identifier: EUPL-1.2
#
# Pull requests always lint and test the series; changed files scope the
# pinned FFmpeg apply, regeneration, build, FATE, parity and warning gates
# and the macOS Metal build. Main and release runs keep the full gate.
name: series

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # release.yml runs the full gate on the tagged commit before it builds.
  workflow_call:

permissions:
  contents: read

env:
  # The Praetor engine of this repository. No job here runs it: the local hooks
  # and `make verify-all` read this pin through .config/lefthook/engine.sh, so
  # a newer praetorctl on a workstation cannot change what the gates decide.
  PRAETOR_REF: 2d23b292417386fe8259da29690266ce331062c6

concurrency:
  # In a called run the context is the caller's, so the workflow name keeps a
  # release call out of a push or pull request run's group.
  group: series-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: series (scope · changed files)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ffmpeg: ${{ steps.scope.outputs.ffmpeg }}
      parity: ${{ steps.scope.outputs.parity }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event.pull_request.draft != true
        with:
          python-version-file: .python-version
      - name: Select CI work from changed files
        id: scope
        if: github.event.pull_request.draft != true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/series.py scope --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" --report "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/series.py scope --full \
              --github-output "$GITHUB_OUTPUT" --report "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: series (check · lint · unit tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event.pull_request.draft != true
        with:
          python-version-file: .python-version
      # numpy: the CIEDE2000 arithmetic of scripts/tonemap_parity.py (ADR-0002).
      - name: Install ruff, reuse and numpy
        if: github.event.pull_request.draft != true
        run: python3 -m pip install ruff==0.16.8 reuse==6.2.0 numpy==2.5.4
      # The release guard tests sign and verify with a throwaway key; the same
      # cosign as the release build, and no transparency log.
      - name: Install cosign
        if: github.event.pull_request.draft != true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Series check, lint and unit tests
        if: github.event.pull_request.draft != true
        run: make test

  apply-build:
    name: series (apply · regenerate · build · FATE · warnings) on the pinned base
    needs: scope
    if: ${{ !cancelled() }}
    # The job runs even after a failed scope job (a skipped job reports
    # success to the required checks); its steps run when the scope job
    # selects it or did not succeed.
    env:
      IN_SCOPE: ${{ needs.scope.result != 'success' || needs.scope.outputs.ffmpeg == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Skip the gate outside the scope of the change
        if: env.IN_SCOPE != 'true'
        run: |
          echo "The scope job selected no work for this job; see its summary." \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        with:
          python-version-file: .python-version
      - name: Load the pinned base
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: grep -E '^FFMPEG_(REMOTE|TAG|COMMIT)=' base.env >> "$GITHUB_ENV"
      - name: Install the FFmpeg build toolchain
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm pkg-config libvulkan-dev spirv-headers libffmpeg-nvenc-dev \
            libva-dev libdrm-dev libvpl-dev libzimg-dev ocl-icd-opencl-dev glslc clang-tidy cppcheck
          gcc --version | head -1
          glslc --version | head -1
          pkg-config --modversion vulkan ffnvcodec libva libdrm vpl zimg OpenCL
      - name: Fetch and verify the pinned FFmpeg source
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          git init -q ffmpeg
          git -C ffmpeg remote add origin "$FFMPEG_REMOTE"
          git -C ffmpeg fetch -q --depth=1 origin \
            "refs/tags/${FFMPEG_TAG}:refs/tags/${FFMPEG_TAG}"
          actual=$(git -C ffmpeg rev-parse --verify "refs/tags/${FFMPEG_TAG}^{commit}")
          if [ "$actual" != "$FFMPEG_COMMIT" ]; then
            echo "::error::${FFMPEG_TAG} peels to ${actual}, base.env pins ${FFMPEG_COMMIT}"
            exit 1
          fi
          git -C ffmpeg checkout -q --detach "$FFMPEG_COMMIT"
      - name: Apply the series
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: python3 scripts/series.py apply --expect-base ffmpeg --report "$GITHUB_STEP_SUMMARY"
      - name: Refuse functions the series grows past 60 lines without an exception
        # Rule HISS-04: functions grown past 60 lines need a live exception in
        # the patch's metadata TOML; unexcused or stale entries fail the gate.
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: python3 scripts/series.py lengths ffmpeg --report "$GITHUB_STEP_SUMMARY"
      - name: Patches match deterministic regeneration
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          python3 scripts/series.py export ffmpeg
          if ! git diff --exit-code --stat -- patches series.txt; then
            echo "::error::patches/ differs from a fresh export of the applied series"
            git diff -- patches series.txt | head -200
            exit 1
          fi
      - name: Configure FFmpeg
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          mkdir build
          cd build
          # Patches touch the Vulkan, NVENC, VAAPI and QSV code; enabling them explicitly
          # makes a missing dependency fail here instead of silently skipping files.
          # --enable-gpl builds the GPL-only filters 0002 changes (find_rect, mcdeint,
          # eq and its checkasm test), which an LGPL build skips.
          # glslc provides spirv_compiler, without which configure drops the Vulkan
          # encoders and filters that compile shaders, such as ffv1enc_vulkan.c (0007).
          # --enable-libzimg builds vf_zscale.c, which 0014 changes; --enable-opencl
          # builds vf_tonemap_opencl.c and its kernels, which 0015 and 0017 change.
          ../ffmpeg/configure --fatal-warnings --disable-doc --enable-gpl --enable-vulkan \
            --enable-nvenc --enable-vaapi --enable-libdrm --enable-libvpl --enable-libzimg \
            --enable-opencl \
            || { tail -40 ffbuild/config.log; exit 1; }
      - name: Lint the C sources of this repository with clang-tidy and cppcheck
        # The list is the clang_tidy lane of .standards.yaml. The DV5 fixture
        # generator (ADR-0002) compiles against the pinned FFmpeg headers, taken
        # as system headers so that only the generator is judged.
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          clang-tidy --version | head -2
          cppcheck --version
          mapfile -t sources < .config/clang-tidy/sources.txt
          clang-tidy --quiet "${sources[@]}" -- -std=c17 -isystem ffmpeg -isystem build
          cppcheck --enable=all --std=c17 --check-level=exhaustive --error-exitcode=1 \
            --suppress=missingIncludeSystem --suppress=checkersReport "${sources[@]}"
      - name: Build FFmpeg, its tools and test programs
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        working-directory: build
        run: make -j"$(nproc)" build 2>&1 | tee build.log
      - name: Run the FATE tests that need no samples
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        working-directory: build
        run: |
          mapfile -t targets < <(make -s fate-list | grep '^fate-')
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::FFmpeg listed no FATE target"
            exit 1
          fi
          echo "FATE targets: ${#targets[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          make -j"$(nproc)" -k "${targets[@]}" 2>&1 | tee -a build.log
      - name: Compare the hqdn3d and tonemap GPU filters with the CPU filters on software devices
        # ADR-0004: the GPU hqdn3d filters must give the CPU filter's samples;
        # tonemap_opencl and tonemap_vulkan must stay within one code value of
        # tonemap=bt2408_hable (0015, 0017, 0019, 0021, 0034). The
        # hosted runner has no GPU, so Mesa lavapipe (Vulkan) and rusticl on
        # llvmpipe (OpenCL) run the same shaders and kernels on the CPU. PoCL
        # is not used: it offers FFmpeg no planar or semi-planar image format.
        # The loaders see only those drivers; the step fails when FFmpeg opens
        # another device or when a device case is skipped instead of run.
        if: >-
          github.event.pull_request.draft != true && env.IN_SCOPE == 'true' &&
          (needs.scope.result != 'success' || needs.scope.outputs.parity == 'true')
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers mesa-opencl-icd
          lvp=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          if [ -z "$lvp" ] || [ ! -f /etc/OpenCL/vendors/rusticl.icd ]; then
            echo "::error::lavapipe or rusticl is not installed"
            exit 1
          fi
          export VK_DRIVER_FILES="$lvp"
          export OCL_ICD_VENDORS=/etc/OpenCL/vendors/rusticl.icd RUSTICL_ENABLE=llvmpipe
          export VK_FFMPEG="$PWD/build/ffmpeg" VK_DEVICE=0
          export OCL_FFMPEG="$PWD/build/ffmpeg" OCL_DEVICE=0.0
          probe() {
            if ! build/ffmpeg -hide_banner -nostdin -v verbose -init_hw_device "$1" \
              -f lavfi -i nullsrc=d=0.04 -f null - > probe.log 2>&1; then
              cat probe.log
              echo "::error::$1 could not be opened"
              exit 1
            fi
            if ! grep -qi "$2" probe.log; then
              cat probe.log
              echo "::error::$1 did not open $2"
              exit 1
            fi
            grep -i "$2" probe.log | head -2
          }
          probe vulkan=vk:0 llvmpipe
          probe opencl=ocl:0.0 rusticl
          python3 -m unittest -v -k matches_cpu -k temporal_only -k graph_rebuild \
            -k unsupported_format -k planted -k MismatchRule \
            tests.test_hqdn3d_vulkan tests.test_hqdn3d_opencl 2>&1 | tee parity.log
          hqdn3d=${PIPESTATUS[0]}
          python3 -m unittest -v tests.test_tonemap_vulkan tests.test_tonemap_opencl 2>&1 \
            | tee -a parity.log
          tonemap=${PIPESTATUS[0]}
          if grep -E "skipped 'set (VK|OCL)_" parity.log; then
            echo "::error::a device case was skipped instead of run"
            exit 1
          fi
          if [ "$hqdn3d" -ne 0 ] || [ "$tonemap" -ne 0 ]; then
            echo "::error::hqdn3d tests exited $hqdn3d, tonemap tests exited $tonemap"
            exit 1
          fi
      - name: Refuse a build that skipped a C file the series changes
        # A file in a component this configuration leaves out would pass the
        # warning gate unseen, so every changed C file needs a CC line.
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: python3 scripts/series.py coverage ffmpeg build/build.log --report "$GITHUB_STEP_SUMMARY"
      - name: Refuse compiler warnings in the files the series changes
        # Warnings elsewhere depend on the runner's libraries and FFmpeg's own
        # sources; they are counted in the summary, not gated.
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          gcc --version | head -1 >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/series.py warnings ffmpeg build/build.log --report "$GITHUB_STEP_SUMMARY"

  macos-build:
    # ADR-0004: the Metal (VideoToolbox) filters of the series are built on
    # macOS; their GPU output is not compared with the CPU filter until an
    # Apple host can run the parity tests.
    name: series (apply · build · warnings) on macOS with Metal
    needs: scope
    if: ${{ !cancelled() }}
    # The job runs even after a failed scope job (a skipped job reports
    # success to the required checks); its steps run when the scope job
    # selects it or did not succeed.
    env:
      IN_SCOPE: ${{ needs.scope.result != 'success' || needs.scope.outputs.macos == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Skip the gate outside the scope of the change
        if: env.IN_SCOPE != 'true'
        run: |
          echo "The scope job selected no work for this job; see its summary." \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        with:
          python-version-file: .python-version
      - name: Load the pinned base
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: grep -E '^FFMPEG_(REMOTE|TAG|COMMIT)=' base.env >> "$GITHUB_ENV"
      - name: Install the Metal toolchain
        # Xcode ships the Metal compiler as a separate component; without it
        # configure turns Metal off instead of failing.
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal -v; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal -v
          fi
      - name: Fetch and verify the pinned FFmpeg source
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          git init -q ffmpeg
          git -C ffmpeg remote add origin "$FFMPEG_REMOTE"
          git -C ffmpeg fetch -q --depth=1 origin \
            "refs/tags/${FFMPEG_TAG}:refs/tags/${FFMPEG_TAG}"
          actual=$(git -C ffmpeg rev-parse --verify "refs/tags/${FFMPEG_TAG}^{commit}")
          if [ "$actual" != "$FFMPEG_COMMIT" ]; then
            echo "::error::${FFMPEG_TAG} peels to ${actual}, base.env pins ${FFMPEG_COMMIT}"
            exit 1
          fi
          git -C ffmpeg checkout -q --detach "$FFMPEG_COMMIT"
      - name: Apply the series
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: python3 scripts/series.py apply --expect-base ffmpeg --report "$GITHUB_STEP_SUMMARY"
      - name: Configure FFmpeg with Metal and VideoToolbox
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          mkdir build
          cd build
          ../ffmpeg/configure --fatal-warnings --disable-doc --enable-gpl \
            --enable-videotoolbox --enable-metal \
            || { tail -40 ffbuild/config.log; exit 1; }
          # configure disables Metal when the compiler check fails; the
          # VideoToolbox filters must be in the build.
          if ! grep -q '^#define CONFIG_YADIF_VIDEOTOOLBOX_FILTER 1' config_components.h; then
            echo "::error::configure left out Metal: yadif_videotoolbox is not enabled"
            grep -h -E 'HAVE_METAL|VIDEOTOOLBOX' config.h config_components.h
            exit 1
          fi
      - name: Build FFmpeg, its tools and test programs
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        working-directory: build
        run: make -j"$(sysctl -n hw.ncpu)" build 2>&1 | tee build.log
      - name: Refuse compiler warnings in the files the series changes
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          clang --version >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/series.py warnings ffmpeg build/build.log --report "$GITHUB_STEP_SUMMARY"
      # Probe for #114, not for merge: report the Metal device the hosted
      # runner exposes, then run the device cases of the Metal hqdn3d test.
      # A hosted runner is a virtual machine; a result here is no parity
      # result on Apple hardware.
      - name: Probe the Metal device of the runner
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          {
            echo "## Metal probe"
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            sw_vers
            sysctl -n machdep.cpu.brand_string hw.model
            system_profiler SPDisplaysDataType
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat > probe.swift <<'SWIFT'
          import Foundation
          import Metal
          guard let d = MTLCreateSystemDefaultDevice() else {
              print("MTLCreateSystemDefaultDevice: nil")
              exit(3)
          }
          print("device: \(d.name)")
          print("registryID: \(d.registryID) lowPower: \(d.isLowPower) headless: \(d.isHeadless) removable: \(d.isRemovable)")
          print("unifiedMemory: \(d.hasUnifiedMemory) apple7: \(d.supportsFamily(.apple7)) mac2: \(d.supportsFamily(.mac2))")
          print("recommendedMaxWorkingSetSize: \(d.recommendedMaxWorkingSetSize)")
          SWIFT
          swiftc -O probe.swift -o probe
          ./probe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the device cases of the Metal hqdn3d test
        if: github.event.pull_request.draft != true && env.IN_SCOPE == 'true'
        run: |
          make -C build -j"$(sysctl -n hw.ncpu)" tools/hqdn3d_reset_test
          VT_FFMPEG="$PWD/build/ffmpeg" \
          HQDN3D_RESET_TOOL="$PWD/build/tools/hqdn3d_reset_test" \
            python3 -m unittest -v tests.test_hqdn3d_videotoolbox 2>&1 \
            | tee device-cases.log
          { echo '```'; cat device-cases.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
