# SPDX-License-Identifier: EUPL-1.2
#
# The consumers apply their own FFmpeg patch stacks on top of this series,
# each from ffmpeg-patches/series.txt on its default branch unless a dispatch
# or committed .github/consumer-refs/<consumer> file names a Pelorus or vmafx
# branch (dispatch input takes precedence). The job's
# CONSUMERS map is the one place to add a consumer; the owner follows this
# repository's owner, so forks use their own consumers.
# This run applies the series on the pinned base, then each
# consumer stack on top, the way their builds do. A handed-over patch passes
# only when a series patch declares its consumer and covers all its added
# lines, and the consumer's pinned tag does not yet contain that series patch;
# the consumer must drop it on its next pin bump. Other failures stay red.
# On a pull request it shows that a series change breaks a
# consumer before a release carries it; the nightly run shows that a
# consumer change no longer fits the series on main. Apply only: the
# consumers' builds need their own libraries and run in their repositories.
name: consumer stacks

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:
    inputs:
      pelorus_ref:
        description: >-
          Pelorus branch whose stack to apply; empty takes the Pelorus
          default branch
        type: string
        required: false
        default: ''
      vmafx_ref:
        description: >-
          vmafx branch whose stack to apply; empty takes the vmafx
          default branch
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: consumers-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  consumers:
    name: consumer stacks (vmafx · pelorus) on the series
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CONSUMER_OWNER: ${{ github.repository_owner }}
      CONSUMERS: >-
        vmafx:FFMPEG_FIX_SERIES_TAG pelorus:FFMPEG_SERIES_TAG
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        if: github.event.pull_request.draft != true
      # A dispatch or committed .github/consumer-refs/<consumer> file may name
      # the Pelorus or vmafx branch to test a consumer change against a series
      # branch before either lands. A non-empty dispatch input takes precedence
      # over the file; when an input is provided, the file is not read. The
      # names only reach the shell through the environment or file read, and
      # only branch-name characters pass; everything else stops the run before
      # any clone.
      - name: Check the consumer refs
        if: github.event.pull_request.draft != true
        env:
          PELORUS_REF: ${{ inputs.pelorus_ref }}
          VMAFX_REF: ${{ inputs.vmafx_ref }}
        run: |
          # Validate a branch name against character set, length, and Git formatting rules.
          plain_branch() {
            [[ "$1" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] \
              && timeout 10s git check-ref-format --branch "$1" > /dev/null
          }
          warnings=()
          for input in pelorus_ref vmafx_ref; do
            consumer=${input%_ref}
            case "$input" in
              pelorus_ref) ref=$PELORUS_REF ;;
              vmafx_ref) ref=$VMAFX_REF ;;
            esac
            from_file=0
            if [ -z "$ref" ]; then
              file=".github/consumer-refs/$consumer"
              if [ -e "$file" ] || [ -L "$file" ]; then
                if [ -L "$file" ] || ! [ -f "$file" ]; then
                  echo "::error::$input file is not a regular file"
                  exit 1
                fi
                if ! ref=$(timeout 10s head -c 256 -- "$file"); then echo "::error::$input file could not be read"; exit 1; fi
                from_file=1
              fi
            fi
            if [ -n "$ref" ] || [ "$from_file" = 1 ]; then
              if ! plain_branch "$ref"; then
                echo "::error::$input is not a plain branch name"
                exit 1
              fi
              if [ "$from_file" = 1 ]; then
                warnings+=("::warning::${consumer} consumer ref ${ref} comes from .github/consumer-refs/${consumer}; reset it after the consumer lands")
              fi
            fi
            case "$input" in
              pelorus_ref) PELORUS_REF=$ref ;;
              vmafx_ref) VMAFX_REF=$ref ;;
            esac
          done
          for warning in "${warnings[@]}"; do
            echo "$warning"
            echo "$warning" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "PELORUS_REF=$PELORUS_REF" >> "$GITHUB_ENV"
          echo "VMAFX_REF=$VMAFX_REF" >> "$GITHUB_ENV"
      - name: Prepare the pinned source
        if: github.event.pull_request.draft != true
        uses: ./.github/actions/prepare-series
        with:
          toolchain: none
          setup-python: 'false'
          report: 'false'
          in-scope: 'true'
          draft: ${{ github.event.pull_request.draft == true }}
      - name: Fetch the consumer stacks
        if: github.event.pull_request.draft != true
        run: |
          read -r -d '' -a entries < <(printf '%s\0' "$CONSUMERS")
          if (( ${#entries[@]} == 0 || ${#entries[@]} > 16 )); then
            echo "::error::consumer map must contain 1 to 16 entries"
            exit 1
          fi
          declare -A seen=()
          for entry in "${entries[@]}"; do
            consumer=${entry%%:*}
            variable=${entry#*:}
            if ! [[ "$consumer" =~ ^[a-z][a-z0-9-]{0,38}$ ]] \
              || ! [[ "$variable" =~ ^[A-Z][A-Z0-9_]{0,63}$ ]]; then
              echo "::error::invalid consumer map entry: $entry"
              exit 1
            fi
            if [[ ${seen[$consumer]+present} ]]; then
              echo "::error::duplicate consumer name: $consumer"
              exit 1
            fi
            seen[$consumer]=1
            key=${consumer^^}
            key=${key//-/_}_SERIES_TAG
            if [[ "$key" = GITHUB_* || "$key" = RUNNER_* ]]; then
              echo "::error::reserved consumer environment key: $key"
              exit 1
            fi
          done
          for entry in "${entries[@]}"; do
            consumer=${entry%%:*}
            branch=()
            case "$consumer" in
              pelorus) ref=$PELORUS_REF ;;
              vmafx) ref=$VMAFX_REF ;;
              *) ref= ;;
            esac
            if [ -n "$ref" ]; then
              branch=(--branch "$ref")
            fi
            git clone -q --depth=1 --filter=blob:none --sparse "${branch[@]}" \
              "https://github.com/${CONSUMER_OWNER}/${consumer}.git" "consumers/${consumer}"
            git -C "consumers/${consumer}" sparse-checkout set ffmpeg-patches
            # Cone mode keeps root files, including the consumer's series pin.
            test -f "consumers/${consumer}/build-config.env"
            git -C "consumers/${consumer}" log -1 --format="${consumer} %H %cs %s" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Read the consumer series pins
        if: github.event.pull_request.draft != true
        run: |
          read -r -d '' -a entries < <(printf '%s\0' "$CONSUMERS")
          for entry in "${entries[@]}"; do
            consumer=${entry%%:*}
            variable=${entry#*:}
            tag=$(grep -E "^${variable}=" "consumers/${consumer}/build-config.env")
            tag=${tag#*=}
            tag=${tag//\"/}
            tag=${tag//\'/}
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${consumer} series pin is not a vMAJOR.MINOR.PATCH tag"
              exit 1
            fi
            key=${consumer^^}
            key=${key//-/_}_SERIES_TAG
            printf '%s=%s\n' "$key" "$tag" >> "$GITHUB_ENV"
          done
      - name: Apply each consumer stack on top of the series
        if: github.event.pull_request.draft != true
        run: |
          read -r -d '' -a entries < <(printf '%s\0' "$CONSUMERS")
          stacks=()
          pins=()
          for entry in "${entries[@]}"; do
            consumer=${entry%%:*}
            key=${consumer^^}
            key=${key//-/_}_SERIES_TAG
            tag=${!key}
            stacks+=("${consumer}=consumers/${consumer}/ffmpeg-patches")
            pins+=(--pin "${consumer}=$tag")
          done
          python3 scripts/consumer_stacks.py ffmpeg "${stacks[@]}" \
            --series-dir . "${pins[@]}" \
            --report "$GITHUB_STEP_SUMMARY"
