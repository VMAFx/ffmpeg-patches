#
# The consumers apply their own FFmpeg patch stacks on top of this series:
# VMAFx/vmafx and VMAFx/pelorus, each from ffmpeg-patches/series.txt on its
# default branch. This run applies the series on the pinned base, then each
# consumer stack on top, the way their builds do. A handed-over patch passes
# only when a series patch declares its consumer and covers all its added
# lines, and the consumer's pinned tag does not yet contain that series patch;
# the consumer must drop it on its next pin bump. Other failures stay red.
# On a pull request it shows that a series change breaks a
# consumer before a release carries it; the nightly run shows that a
# consumer change no longer fits the series on main. Apply only: the
# consumers' builds need their own libraries and run in their repositories.
name: consumer stacks

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:
    inputs:
      pelorus_ref:
        description: >-
          Pelorus branch whose stack to apply; empty takes the Pelorus
          default branch
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: consumers-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  consumers:
    name: consumer stacks (vmafx · pelorus) on the series
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        if: github.event.pull_request.draft != true
      # A dispatch may name the Pelorus branch to test, for a Pelorus change
      # that has to fit a series branch before either lands. The name only
      # reaches the shell through the environment, and only branch-name
      # characters pass; everything else stops the run before any clone.
      - name: Check the Pelorus ref
        if: github.event.pull_request.draft != true
        env:
          PELORUS_REF: ${{ inputs.pelorus_ref }}
        run: |
          if [ -n "$PELORUS_REF" ]; then
            if ! [[ "$PELORUS_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] \
              || ! git check-ref-format --branch "$PELORUS_REF" > /dev/null; then
              echo "::error::pelorus_ref is not a plain branch name"
              exit 1
            fi
          fi
          echo "PELORUS_REF=$PELORUS_REF" >> "$GITHUB_ENV"
      - name: Prepare the pinned source
        if: github.event.pull_request.draft != true
        uses: ./.github/actions/prepare-series
        with:
          toolchain: none
          setup-python: 'false'
          report: 'false'
          in-scope: 'true'
          draft: ${{ github.event.pull_request.draft == true }}
      - name: Fetch the consumer stacks
        if: github.event.pull_request.draft != true
        run: |
          for consumer in vmafx pelorus; do
            branch=()
            if [ "$consumer" = pelorus ] && [ -n "$PELORUS_REF" ]; then
              branch=(--branch "$PELORUS_REF")
            fi
            git clone -q --depth=1 --filter=blob:none --sparse "${branch[@]}" \
              "https://github.com/VMAFx/${consumer}.git" "consumers/${consumer}"
            git -C "consumers/${consumer}" sparse-checkout set ffmpeg-patches
            # Cone mode keeps root files, including the consumer's series pin.
            test -f "consumers/${consumer}/build-config.env"
            git -C "consumers/${consumer}" log -1 --format="${consumer} %H %cs %s" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Read the consumer series pins
        if: github.event.pull_request.draft != true
        run: |
          for consumer in vmafx pelorus; do
            case "$consumer" in
              vmafx) variable=FFMPEG_FIX_SERIES_TAG ;;
              pelorus) variable=FFMPEG_SERIES_TAG ;;
            esac
            tag=$(grep -E "^${variable}=" "consumers/${consumer}/build-config.env")
            tag=${tag#*=}
            tag=${tag//\"/}
            tag=${tag//\'/}
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${consumer} series pin is not a vMAJOR.MINOR.PATCH tag"
              exit 1
            fi
            printf '%s_SERIES_TAG=%s\n' "${consumer^^}" "$tag" >> "$GITHUB_ENV"
          done
      - name: Apply each consumer stack on top of the series
        if: github.event.pull_request.draft != true
        run: |
          python3 scripts/consumer_stacks.py ffmpeg \
            vmafx=consumers/vmafx/ffmpeg-patches \
            pelorus=consumers/pelorus/ffmpeg-patches \
            --series-dir . \
            --pin "vmafx=$VMAFX_SERIES_TAG" --pin "pelorus=$PELORUS_SERIES_TAG" \
            --report "$GITHUB_STEP_SUMMARY"
