name: Prepare the series
description: Set up Python, optionally install a toolchain, and fetch and apply the pinned series.
inputs:
  toolchain:
    description: linux for the FFmpeg build tools; metal for the Xcode Metal compiler; none to skip.
    required: true
  setup-python:
    description: Whether to set up Python before preparing the series.
    default: 'true'
  report:
    description: Whether to append the apply report to the job summary.
    default: 'true'
  in-scope:
    description: Whether the scope job selected this build.
    required: true
  draft:
    description: Whether the pull request is a draft.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-python
      if: inputs.draft != 'true' && inputs.in-scope == 'true' && inputs.setup-python == 'true'
    - name: Load the pinned base
      if: inputs.draft != 'true' && inputs.in-scope == 'true'
      shell: bash
      run: grep -E '^FFMPEG_(REMOTE|TAG|COMMIT)=' base.env >> "$GITHUB_ENV"
    - name: Install the FFmpeg build toolchain
      if: inputs.draft != 'true' && inputs.in-scope == 'true' && inputs.toolchain == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential nasm pkg-config libvulkan-dev spirv-headers libffmpeg-nvenc-dev \
          libva-dev libdrm-dev libvpl-dev libzimg-dev ocl-icd-opencl-dev glslc clang-tidy cppcheck
        gcc --version | head -1
        glslc --version | head -1
        pkg-config --modversion vulkan ffnvcodec libva libdrm vpl zimg OpenCL
    - name: Install the Metal toolchain
      # Xcode ships the Metal compiler as a separate component; without it
      # configure turns Metal off instead of failing.
      if: inputs.draft != 'true' && inputs.in-scope == 'true' && inputs.toolchain == 'metal'
      shell: bash
      run: |
        xcodebuild -version
        if ! xcrun -sdk macosx metal -v; then
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal -v
        fi
    - name: Fetch and verify the pinned FFmpeg source
      if: inputs.draft != 'true' && inputs.in-scope == 'true'
      shell: bash
      run: bash scripts/fetch_ffmpeg.sh
    - name: Apply the series
      if: inputs.draft != 'true' && inputs.in-scope == 'true'
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
      run: |
        args=()
        if [ "$REPORT" = true ]; then
          args=(--report "$GITHUB_STEP_SUMMARY")
        fi
        python3 scripts/series.py apply --expect-base ffmpeg "${args[@]}"
