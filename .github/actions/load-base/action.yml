name: Load the pinned base
description: Export the pinned FFmpeg remote, tag and commit to the job environment.
runs:
  using: composite
  steps:
    - shell: bash
      run: grep -E '^FFMPEG_(REMOTE|TAG|COMMIT)=' base.env >> "$GITHUB_ENV"
