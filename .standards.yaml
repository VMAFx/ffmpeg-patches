---
version: 1
repository:
  owner: VMAFx
  name: ffmpeg-patches
  forge: github
  default_branch: main
  visibility: public
  description: "Shared FFmpeg fix patch series for VMAFx projects, tracked against FFmpeg master and sent upstream"
  homepage: ""
  topics: []
# Pinned by hand: auto-detection reads the README-only seed as template-seed.
# Re-adopt with the patch-series archetype once cordanaLLM/praetor#1110 lands.
profiles:
  - native-gpu-systems
facets:
  - security:high
  - agent:sandboxed
overrides:
  branch_protection:
    # Solo repository: no second maintainer or review bot can approve yet.
    review_mode: single_maintainer
clang_tidy:
  lanes:
    # series.yml (apply-build) runs clang-tidy and cppcheck on this list.
    - name: "fixtures"
      files: ".config/clang-tidy/sources.txt"
register:
  sources:
    expected: 13
    sha256:
      sha256:ca38d7be8852847d9325ad2f9c045b4db495d8f656f5edcd90c0cbf8c960b9fe
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
