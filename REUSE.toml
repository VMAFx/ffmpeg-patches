# SPDX-FileCopyrightText: 2026 Lusoris
# SPDX-License-Identifier: EUPL-1.2
#
# Copyright and licence of every file in the repository. REUSE 3.3 applies only
# the last table whose path matches a file, so the whole-tree default comes
# first and every narrower table follows it.

version = 1

# Repository tooling, documentation and the files Praetor manages (agent
# context projections, governance manifests) are EUPL-1.2. "closest" lets a
# file's own SPDX header win where it has one.
[[annotations]]
path = ["*", ".*", "*/**", ".*/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Lusoris"
SPDX-License-Identifier = "EUPL-1.2"

# The patches change FFmpeg's own LGPL-2.1-or-later sources and carry their
# context lines, so they keep FFmpeg's licence, and FFmpeg's copyright applies
# next to the patch author's.
[[annotations]]
path = ["patches/*.patch"]
precedence = "override"
SPDX-FileCopyrightText = ["2000-2026 the FFmpeg developers", "2026 Lusoris"]
SPDX-License-Identifier = "LGPL-2.1-or-later"

# 0022 ports p5_to_p81 from dovi_tool 2.3.4, whose MIT notice the patch
# carries next to the ported code in libavfilter/dovi_reshape.c.
[[annotations]]
path = ["patches/0022-avfilter-vf_dovi_reshape-add-a-profile-8.1-RPU-outpu.patch"]
precedence = "override"
SPDX-FileCopyrightText = ["2000-2026 the FFmpeg developers", "2026 Lusoris", "2026 quietvoid"]
SPDX-License-Identifier = "LGPL-2.1-or-later AND MIT"

# 0023 moves code of the GPL-2.0-or-later vf_hqdn3d.c into hqdn3d_coefs.c and
# ports its algorithm to new GPL-2.0-or-later files; the build glue it touches
# stays LGPL-2.1-or-later.
[[annotations]]
path = ["patches/0023-avfilter-vf_hqdn3d_vulkan-add-a-Vulkan-hqdn3d-filter.patch"]
precedence = "override"
SPDX-FileCopyrightText = ["2000-2026 the FFmpeg developers", "2003 Daniel Moreno", "2010 Baptiste Coudurier", "2012 Loren Merritt", "2026 Lusoris"]
SPDX-License-Identifier = "LGPL-2.1-or-later AND GPL-2.0-or-later"

# The register skills' LICENSE files are the MIT texts of their upstreams,
# installed byte for byte by Praetor. REUSE does not lint files named LICENSE,
# so they need no table here.
