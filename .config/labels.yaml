---
# Canonical Repository Label Taxonomy
version: 1
labels:
  - name: "hiss-violation"
    color: "d73a4a"
    description: "Code introduces a regression against HISS invariants"

  - name: "hiss-waiver"
    color: "fbca04"
    description: "Architectural exception to HISS (waivers are not signed)"

  - name: "standards-sync"
    color: "0075ca"
    description: "Automated configuration sync generated by Praetor"

  - name: "flavor:bleeding"
    color: "e99695"
    description: "Dependencies or assets targeting bleeding-edge branch"

  - name: "flavor:latest"
    color: "0e8a16"
    description: "Dependencies or assets targeting latest stable release"

  - name: "flavor:lts"
    color: "5319e7"
    description: "Dependencies or assets targeting long-term support release"

  - name: "security:high"
    color: "b60205"
    description: "High-security facet: SLSA-3, Cosign, zero-CVE invariant"

  - name: "breaking-change"
    color: "b60205"
    description: "Breaking API change requiring mandatory Migration: footer"

  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"

  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"

  - name: "triage"
    color: "ededed"
    description: "Awaiting maintainer triage"

  - name: "rfc"
    color: "c5def5"
    description: "Request for comments on a proposed change"

  - name: "api-review"
    color: "1d76db"
    description: "Changes a public API contract and needs API review"

  - name: "dependencies"
    color: "0366d6"
    description: "Pull requests that update a dependency file"

  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"

  - name: "duplicate"
    color: "cfd3d7"
    description: "This issue or pull request already exists"

  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"

  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"

  - name: "invalid"
    color: "e4e669"
    description: "This doesn't seem right"

  - name: "question"
    color: "d876e3"
    description: "Further information is requested"

  - name: "wontfix"
    color: "ffffff"
    description: "This will not be worked on"

  - name: "research-watch"
    color: "5319e7"
    description: "Upstream or research watch item (feed for the fleet research hub)"

  - name: "needs-hardware"
    color: "c5def5"
    description: "Done-when needs hardware no CI runner or fleet host has (for example a real Apple GPU)"
