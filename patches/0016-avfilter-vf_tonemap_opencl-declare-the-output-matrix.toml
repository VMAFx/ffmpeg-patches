notes = """
tonemap_opencl wrote its m and r options into the frames but left the input's matrix and range on the output link, so a software conversion after hwdownload converted BT.709 frames again as BT.2020: pure red HDR10 to BT.709 gave Y 73 instead of 63 after format=yuv420p. Query function as in vf_libplacebo and vf_colorspace; without m and r both links share one list as before. tests/test_tonemap_opencl.py (OCL_FFMPEG, OCL_DEVICE; skipped without a device) passes on an RTX 4090 and an Arc A380 and fails with the old FILTER_SINGLE_PIXFMT (6 of 8 cases, Y 73 for 63); a planted BT.2020 label before the conversion is refused. FATE has no OpenCL device tests. No version.h or Changelog bump."""
