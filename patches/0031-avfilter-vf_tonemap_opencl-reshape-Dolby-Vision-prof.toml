origin = "#63 Dolby Vision profile 5 reshape (ADR-0002), part 4: the RPU reshape in the bt2408_hable kernel of tonemap_opencl"
notes = """
With tonemap=bt2408_hable and full range IPT-C2 input, tonemap_opencl builds its kernel with DOVI_RESHAPE and applies the RPU polynomial and MMR reshape and the IPT to RGB matrices per pixel from a constant buffer (FFDoviReshape, 2804 bytes, static_assert); chroma is interpolated from the chroma location. The kernel math follows libplacebo v7.360.1 (LGPL-2.1-or-later), credited in opencl/dovi_reshape.cl. Other curves (ENOSYS), limited range input (ENOSYS) and frames without DOVI metadata (EINVAL) are refused. tonemap_opencl_init and filter_frame are split into helpers (175 to 73 and 130 to 121 lines). Measured on an Arc A380 (OpenCL platform 1.0) with four frames of the 1280x720 profile 5 clip of #63, against dovi_reshape followed by tonemap_opencl: mean absolute difference Y 0.493, U 0.140, V 0.244 code values (max 4); mean CIEDE2000 0.40, p99 1.57, max 2.93, under the 2.3 bar of ADR-0002 (an hflip plant gives 40.0). HDR10 output of bt2408_hable, hable and reinhard at tv and pc range is framemd5-identical to the build without this series. Planted cases: deleting the DOVI metadata fails with rc 234, a flipped MMR sign raises the V difference to 66 code values. Gap: taking the top-left chroma sample instead of interpolating moves the Y difference only from 0.493 to 0.497 on this clip, so neither probe isolates chroma siting. Not run on the RTX 4090."""
