origin = "part 3 of the Dolby Vision profile 5 tone-mapping series without libplacebo (ADR-0002): the bt2408_hable curve of tonemap_vaapi through the VAAPI 3D LUT filter"
notes = """
The 0013 helper fills a 16-bit RGB 3D LUT on the PQ R'G'B' grid (65^3 on iHD), applied by VAProcFilter3DLUT; a driver without one is refused, no fallback to the driver curve. Output 8-bit full range BT.709 RGB only: with NV12 output iHD converts the LUT output again and the colours are wrong. New peak option; display cannot be combined with the curve; the default tonemap value (the driver curve) has no named constant. scripts/tonemap_parity.py against vf_libplacebo hable, Arc A380, iHD 26.3.5: profile 5 clip of tests/fixtures/dv5 mean CIEDE2000 1.147, p95 3.476; 2160p HDR10 clip mean 0.752, p95 1.777 (ADR-0002 bar 2.3). A planted fixed peak of 4000 cd/m^2 fails both at 5.042 and 4.658. Speed is bound by the RGBA hwdownload on iHD (about 0.9 s CPU per 2160p frame): 60 HDR10 frames take 56.5 s with the LUT and download, against 1.8 s for the LUT followed by scale_vaapi to NV12 on the GPU. That GPU-resident chain stays within the bar (mean 1.489 DV5, 1.784 HDR10) but iHD converts RGB to NV12 with a wrong matrix, so the documented chain downloads RGBA. Peak VRAM of the process (xe fdinfo drm-resident-vram0): 44 MiB at 720p, 99 MiB at 2160p; vf_libplacebo does not initialise on the A380 Vulkan device, so there is no A380 reference figure. tests/test_tonemap_vaapi.py matches the CPU path within one 8-bit code value on five flat colours, refuses a planted peak of 4000 cd/m^2 and checks the refusal of NV12 output; dropping the output gamma of the table fails four cases. No version.h or Changelog bump."""

