origin = "#63 dynamic HDR10 peak on the GPU tone maps (ADR-0002, ADR-0003), part 3: tonemap_opencl bt2408_hable"
notes = """
New option peak_detect (default 0), same name and meaning as in 0021 and 0022; the existing threshold option sets the scene-change window, as in tonemap_vulkan. With tonemap=bt2408_hable the peak comes from peak=, then Dolby Vision level 1, then detection when peak_detect=1, then static side data. opencl/tonemap_peak.cl ports the tonemap_vulkan compute pass (16x16 tiles, PQ histogram, average and maximum) and feeds the shared tonemap_peak code of 0021; other curves keep their own detector and ignore the option. Detection runs after the lazy init, so the kernel exists on the first frame. tonemap_opencl_init shrinks from 73 to 57 lines and tonemap_opencl_filter_frame from 85 to 81; every new function stays under 60. Measured on an Arc A380 (OpenCL platform 1.0): with peak_detect=0, framemd5 of 13 CPU, zscale, OpenCL and VAAPI chains matches the build without the patch. scripts/tonemap_parity.py against tonemap=bt2408_hable:peak_detect=1 on the CPU, 1080p HDR10 clip (true peak about 1000 cd/m^2) tagged MaxCLL 1000, 4000 and 10000: mean CIEDE2000 0.279 on all three, against 0.494, 4.42 and 5.313 for the static peak (bar 2.3); a planted peak=40 with peak_detect=1 gives 4.42 and fails. tests/test_tonemap_opencl.py: GPU detection matches CPU detection on five flat colours (0 code values apart); the planted run without detection, on the 10000 cd/m^2 static peak of a raw frame, is 84 code values off and refused; the detection test fails on a build without the patch (option not found). Not run on the RTX 4090. No version.h or Changelog bump."""
