notes = """
Pelorus keeps its blob map stripping as a patch on top: it shortens the \
copied payload right before nvenc_hevc_sei_fits(). nvenc_sei_nal_size() \
matches Pelorus pel_sei_nal_bytes() on 200000 random payloads and models \
what the NVENC cap counts (Annex B, emulation prevention included). \
Checked on an RTX 4090, driver 615.78.08, by the Pelorus GPU lane. \
Fixes FFmpeg issue #24972. Upstream form: FFmpeg PR #24993 on master \
ba987fe24d, also checked there on the RTX 4090. PR #24993 was closed \
unmerged by its author on 2026-10-22 in favour of the smaller \
fixed-size check now in PR #24994. The truncation of \
zero-heavy payloads is handled by 0004."""

