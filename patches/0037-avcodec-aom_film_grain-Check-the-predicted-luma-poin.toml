origin = "#107 FFmpeg n9.0.2 warnings under the gcc of the GitHub ubuntu-26.04 runner"
notes = """
The predicted luma path copies num_y_points from the reference set and indexes res[14] and y_points[14] with it. The reference count was checked when that set was parsed, but the bound is not visible at the copy, and gcc 15.2 with -march=x86-64-v3 reports -Wstringop-overflow at the y_points write. The patch checks the copied count against 14 and takes the existing error path; valid streams are unchanged. Measured on 2026-10-27 in a podman ubuntu:26.04 container with APT::Architecture-Variants amd64v3, the package variant the GitHub ubuntu-26.04 runner installs (gcc 15.2.0-16ubuntu1, default -march=x86-64-v3): ./configure --fatal-warnings --enable-version3 --disable-indevs, make build checkasm. n9.0.2 with patches 0001-0035 reports 17 warnings over 7 sites; with 0036-0039 it reports none. The generic x86-64 gcc of ubuntu:26.04 reports only the wmalosslessdec.c warning without these patches and none with them. FATE vvc, lossless-wmall, checkasm and film_grain_params pass on the x86-64-v3 build (134 tests). FFmpeg master 86444dd368 has the same code at every site. Issue #107."""
