origin = "#63 Dolby Vision peak on the GPU tone maps (ADR-0002 filters table), part 2: tonemap_opencl bt2408_hable"
notes = """
With tonemap=bt2408_hable and peak=0, the level 1 max_pq of the frame sets the peak; peak= still overrides it, and frames without level 1 keep the static peak. Other curves are unchanged. tonemap_opencl_filter_frame shrinks by one line (86 to 85). On the direct profile 5 path of 0032, ff_dovi_reshape_set_hdr10_props() writes the RPU's own level 1 into the frame first, so the RPU value wins over an injected key there. Before this patch both profile 5 paths already followed level 1 through MaxCLL rounded to whole nits; the output now uses the exact value. Measured on an Arc A380 (OpenCL platform 1.0), framemd5 over four frames against the build without 0033-0035: HDR10 output identical with and without peak=10; profile 5 direct and via dovi_reshape differ (exact peak); an injected lavfi.dovi.l1_max_pq of 2081 moves the dovi_reshape path, deleting the key or setting it to 0 restores the old digest, peak=10 matches the old digest. Against vf_libplacebo hable with peak_detect=1: mean CIEDE2000 0.869 on profile 5 direct, 1.014 via dovi_reshape, 0.719 on the 2160p HDR10 clip, all under the 2.3 bar of ADR-0002; a planted peak=40 gives 5.27 and 4.78. Gap: no dynamic peak detection on this path; an HDR10 input keeps its static peak. Not run on the RTX 4090."""
