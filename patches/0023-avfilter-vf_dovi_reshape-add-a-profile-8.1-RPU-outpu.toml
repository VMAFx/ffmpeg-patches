origin = "part 7 of the Dolby Vision profile 5 tone-mapping series without libplacebo (ADR-0002): profile 8.1 RPU output from dovi_reshape"
notes = """
New option rpu in dovi_reshape: strip (default) removes the Dolby Vision metadata as 0012 does, p81 rewrites it to a profile 8.1 RPU for the reshaped BT.2020 PQ pixels so that libx265 -dolbyvision 1 writes a profile 8.1 stream. The conversion ports p5_to_p81 of dovi_tool 2.3.4 (MIT, notice in libavfilter/dovi_reshape.c): profile 8.1 header, identity polynomial mapping, the profile 8.1 YCbCr to RGB and RGB to LMS coefficients; level 5 blocks are dropped, which dovi_tool documents as spec non-conformant. On the profile 5 clip of tests/fixtures/dv5 the RPU that libx265 writes is byte-identical to dovi_tool -m 2 extract-rpu of the source; with a level 5 block added by dovi_tool editor it differs from that reference only in the level 5 block, num_ext_blocks and the CRC. Mastering display data comes from the input's stream side data; an input without it needs -x265-params master-display=..., otherwise libx265 refuses to open. With rpu=strip and without the option the output is byte-identical to 0022 (framemd5), and the filter-dovi-reshape and filter-dovi-reshape-graph references are unchanged. tests/test_dovi_reshape_rpu.py checks profile 8.1 without level 5, the refused open without mastering display data, and a planted profile 5 encode; an early return in the conversion and a kept level 5 block each fail it."""
