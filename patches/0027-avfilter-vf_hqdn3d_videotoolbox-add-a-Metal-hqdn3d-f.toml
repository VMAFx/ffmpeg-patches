origin = "part 4 of hqdn3d on the GPU bit-exact to the CPU filter (ADR-0004): a new hqdn3d_videotoolbox filter in two Metal kernels"
notes = """
New filter hqdn3d_videotoolbox with the options and commands of hqdn3d (luma_spatial, chroma_spatial, luma_tmp, chroma_tmp), a step-for-step port of the hqdn3d_opencl kernels of 0026 that uses the same hqdn3d_coefs.c tables. The new files carry the GPL header of vf_hqdn3d.c, and the filter depends on --enable-gpl, metal, corevideo and videotoolbox. The formats are the planar 4:2:0 yuv420p and the two-plane VideoToolbox frames formats nv12, nv16, nv24 (8 bit), p010, p210, p410 (10 bit) and p216, p416 (16 bit); the chroma size follows the format descriptor. The 10-bit formats write the format maximum where the CPU filter writes a value above it, as in 0024; at 16 bits the coefficient table keeps every result between the previous and the current sample, so no value leaves the range. tests/test_hqdn3d_videotoolbox.py checks on every host that validate_format and the filter doc list exactly the tested formats. Built with zero warnings in the series files on the macOS job of series.yml. GPU output parity with the CPU filter is not measured: no Apple host has run tests/test_hqdn3d_videotoolbox.py yet, and Metal compiles shaders with fast math by default, which the rounded normalized reads have not been checked against. tools/hqdn3d_reset_test takes a vt argument; on a build without the filter it exits nonzero."""
