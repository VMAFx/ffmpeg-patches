gets ff_thread_once() through vulkan.h, n9.0.2 does not. \
Measured on an RTX 4090 with a minimal FFmpeg build (hevc decoder, \
hevc_vulkan encoder): Vulkan decode into hevc_vulkan with \
-force_key_frames 2 on a 120-frame clip hangs at frame 61 on n9.0.2 \
(first of 60 runs) and ends all 120 frames in 60 of 60 runs with this \
patch. Bisect between the release/9.0 branch point and master (60 \
runs per step) named \
d0d7d81317 as the first good commit."""

