origin = "part 2 of hqdn3d on the GPU bit-exact to the CPU filter (ADR-0004): a new hqdn3d_cuda filter in two CUDA kernels"
notes = """
New filter hqdn3d_cuda with the options and commands of hqdn3d (luma_spatial, chroma_spatial, luma_tmp, chroma_tmp), a port of the hqdn3d_vulkan algorithm of 0023 that uses the same hqdn3d_coefs.c tables. The new files carry the GPL header of vf_hqdn3d.c, and the filter depends on --enable-gpl and ffnvcodec with cuda_nvcc or cuda_llvm, as bilateral_cuda does. Measured on an RTX 4090 with a cuda-llvm build: the output matches hqdn3d sample for sample on 1920x1080 and 1279x719 noise with default and changed strengths and after a sendcmd that turns the spatial filter off, in yuv420p, yuv422p, yuv444p, yuv420p10, yuv444p10, yuv444p16, nv12, p010 and p016 (54 of 54 framemd5 cases). p012 is not accepted: hwupload_cuda converts it to p016, so no command line reaches that path. The temporal state is dropped where hqdn3d drops it; tools/hqdn3d_reset_test now takes a cuda:<index> device and gives 12 of 12 identical frames over three sizes, and it builds when only one of the two GPU filters is enabled (checked with a --disable-vulkan build). tests/test_hqdn3d_cuda.py runs the parity matrix, the graph rebuild and the reset tool on a device; a +1 on the temporal output in the vertical kernel fails it in 37 cases, and a kept temporal state across the size change fails the in-graph case."""
