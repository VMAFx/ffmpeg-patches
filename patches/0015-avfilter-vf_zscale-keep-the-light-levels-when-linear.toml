zscale drops all colour-dependent side data on a transfer change, so tonemap after zscale=t=linear saw no MaxCLL or mastering display and fell back to a fixed peak (cause 1 of the 0012 parity gap). Keep those two when the output is linear in the same primaries; other colour-dependent side data (ICC, dynamic HDR, Dolby Vision) is dropped as before. make fate-filter-zscale-light-levels passes on n9.0.2 plus 0001-0015 and fails on unpatched vf_zscale.c (light levels dropped on t=linear). No version.h or Changelog bump."""
