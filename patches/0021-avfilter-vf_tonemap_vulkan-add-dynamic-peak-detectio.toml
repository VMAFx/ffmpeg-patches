origin = "part 6 of the Dolby Vision profile 5 tone-mapping series without libplacebo (ADR-0002, ADR-0003): dynamic peak detection in tonemap_vulkan"
notes = """
New options peak_detect (default 0) and threshold (default 0.2) in tonemap_vulkan, same meaning as in vf_tonemap (0020). vulkan/tonemap_peak.comp.glsl decodes P010 PQ BT.2020 limited range, computes the BT.2020 luminance, PQ-encodes it at 14 bits with the black cutoff and reduces each 16x16 tile in shared memory (sum, maximum, black count, histogram); one invocation per tile adds the tile result to a host-visible storage buffer (64-bit sum as two 32-bit words, no shaderInt64). The host waits for that pass, reads the buffer back and runs ff_tonemap_peak_update from tonemap_peak.c (0020), then the tone map pass uses the peak. A frame carrying lavfi.dovi.l1_max_pq is not measured; its level 1 peak is used. Per-frame detected peak against vf_tonemap peak_detect=1 from the verbose log of both filters (RTX 4090): 2160p HDR10, 31 frames, at most 0.0218 percent apart; profile 5 clip identical through the level 1 rule. A shader with the red and blue luma weights swapped moves the HDR10 peak by 4.72 percent. scripts/tonemap_parity.py against vf_libplacebo hable with peak_detect=1, RTX 4090: profile 5 clip of tests/fixtures/dv5 mean CIEDE2000 1.009, p95 3.383; 2160p HDR10 clip mean 0.523, p95 1.133, against 0.721 without peak detection (ADR-0002 bar 2.3). A planted fixed peak of 4000 cd/m^2 fails both at 5.124 and 4.781. Wall time 2.42 s against 2.92 s for libplacebo at 720p, 8.74 s against 5.37 s at 2160p: the host waits for the detection pass on every frame. Memory above idle 106 MiB against 234 MiB at 720p, 500 MiB against 596 MiB at 2160p. tests/test_tonemap_vulkan.py matches the CPU detector within one 8-bit code value on five flat colours, checks that detection changes the output against a fixed peak of 1000 cd/m^2, and refuses a planted peak of 4000 cd/m^2 against the CPU detector; it passes on the RTX 4090, the Arc A380 and the RADV integrated GPU, and the swapped luma weights fail three colours. With peak_detect=0 the output is byte-identical to 0020 (md5 of five 2160p frames). No version.h or Changelog bump."""
