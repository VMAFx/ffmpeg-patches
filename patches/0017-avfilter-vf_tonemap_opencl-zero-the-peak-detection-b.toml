notes = """
Already on FFmpeg master; release/9.0 does not carry it (checked \
2026-10-22 against release/9.0 4cf298e66a). Drop the patch once the \
pinned base contains the commit. It applies to n9.0.2 unchanged. \
0018 moves the util buffer into create_opencl_objects(); before this \
backport it created the buffer without a host pointer there, so the \
series kept the undefined peak detection state that the upstream fix \
removes and conflicted with it on FFmpeg master. 0018 now creates the \
buffer from the zeroed array as this patch does; the tree after the \
whole series differs from the earlier series only in that buffer."""
