status = "unsubmitted"
upstream = ""
consumers = ["vmafx", "pelorus"]
origin = "part 1 of the Dolby Vision profile 5 tone-mapping series without libplacebo (ADR-0002)"
notes = """
CPU filter that applies each frame's RPU through the 0011 helper and \
outputs gbrpf32 PQ BT.2020, full range; mastering display metadata comes \
from the RPU's source range and an L1 block becomes MaxCLL/MaxFALL. On \
the generated profile 5 clip of tests/fixtures/dv5, the \
reshaped output matches vf_libplacebo's own reshaping (tonemapping=clip, \
peak_detect=0) with a PQ difference of mean <= 3.3e-4 and p95 <= 6.2e-4, \
inside one 10-bit code value; dovi_reshape followed by libplacebo hable \
gives mean CIEDE2000 2.217 against libplacebo alone (ADR-0002 bar 2.3). \
The CPU tone stage after it (zscale + tonemap=hable) misses the bar at \
mean CIEDE2000 4.30 to 5.27: zscale drops the light-level side data on \
the transfer change and vf_tonemap's hable differs from libplacebo's; \
recorded on #63, the shared tone stage is the next step. make \
fate-filter-dovi-reshape-graph passes on n9.0.2 plus 0001-0012, with a \
planted wrong chroma siting and a planted wrong RPU coefficient detected \
and limited range refused. The L1 block is also exported as the frame \
metadata lavfi.dovi.l1_max_pq and lavfi.dovi.l1_avg_pq (12-bit PQ code \
values, removed when a frame has none; key names fixed by ADR-0003), \
which 0021 reads; the unit test checks both keys and fails when either \
is missing. No version.h or Changelog bump."""
