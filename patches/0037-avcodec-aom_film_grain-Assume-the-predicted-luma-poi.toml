status = "submitted"
upstream = "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/25534"
consumers = ["vmafx"]
origin = "#107 FFmpeg n9.0.2 warnings under the gcc of the GitHub ubuntu-26.04 runner"
notes = """
The predicted luma path copies num_y_points from the reference set and indexes res[14] and y_points[14] with it. The reference count was checked when that set was parsed, but the bound is not visible at the copy, and gcc 15.2 with -march=x86-64-v3 reports -Wstringop-overflow at the y_points write. The reference is always the first set of the same payload, which cannot predict itself, so the patch states the bound with av_assume(): with assertions enabled it is checked like av_assert0(), otherwise it is a compiler hint and adds no branch; valid streams are unchanged. This is the form of FFmpeg PR 25534 since its head 77c2f4b1c12b (2026-10-27), which replaced an explicit check with the existing error path after review. Measured on 2026-10-27 in a podman ubuntu:26.04 container with APT::Architecture-Variants amd64v3, the package variant the GitHub ubuntu-26.04 runner installs (gcc 15.2.0-16ubuntu1, default -march=x86-64-v3): ./configure --fatal-warnings --enable-version3 --disable-indevs, make build checkasm. n9.0.2 with patches 0001-0035 reports 17 warnings over 7 sites; with 0036-0039 it reports none. The generic x86-64 gcc of ubuntu:26.04 reports only the wmalosslessdec.c warning without these patches and none with them. FATE vvc, lossless-wmall, checkasm and film_grain_params pass on the x86-64-v3 build (134 tests). FFmpeg master 86444dd368 has the same code at every site. Issue #107."""

[[exceptions]]
rule = "HISS-04"
path = "libavcodec/aom_film_grain.c"
function = "ff_aom_parse_film_grain_sets"
lines = 237
category = "D"
entered = "2026-10-27"
expires = "2027-02-24"
reason = "upstream function, 235 lines before the patch; the patch adds only the two-line bound assumption at the predicted luma copy and drops once the pinned base carries it upstream"
