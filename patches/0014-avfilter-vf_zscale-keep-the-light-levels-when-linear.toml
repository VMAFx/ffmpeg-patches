origin = "part 2 of the Dolby Vision profile 5 tone-mapping series without libplacebo (ADR-0002): light levels survive zscale=t=linear"
notes = """
zscale drops all colour-dependent side data on a transfer change, so tonemap after zscale=t=linear saw no MaxCLL or mastering display and fell back to a fixed peak (cause 1 of the 0011 parity gap). Keep those two when the output is linear in the same primaries; other colour-dependent side data (ICC, dynamic HDR, Dolby Vision) is dropped as before. make fate-filter-zscale-light-levels passes on n9.0.2 plus 0001-0014 and fails on unpatched vf_zscale.c (light levels dropped on t=linear). No version.h or Changelog bump. Sent upstream as FFmpeg pull request 25867 on 2026-11-08. Its head adds a review fix this patch does not carry yet: with primariesin set, the light levels are kept only when the zimg source and destination primaries are equal as well as the frame tags."""
