origin = "part 3 of hqdn3d on the GPU bit-exact to the CPU filter (ADR-0004): a new hqdn3d_opencl filter in two OpenCL kernels"
notes = """
New filter hqdn3d_opencl with the options and commands of hqdn3d (luma_spatial, chroma_spatial, luma_tmp, chroma_tmp), a port of the hqdn3d_vulkan algorithm of 0024 that uses the same hqdn3d_coefs.c tables. The new files carry the GPL header of vf_hqdn3d.c, and the filter depends on --enable-gpl and opencl. The OpenCL frames context refuses LSB-aligned 10- and 12-bit planar formats (hwdownload to yuv420p10le fails), so the formats are yuv420p, yuv422p, yuv444p, yuv420p16, yuv444p16, nv12, p010, p012 and p016; p010 and p012 write the format maximum where the CPU filter writes a value above it, as in 0024. Measured with tests/test_hqdn3d_opencl.py on an RTX 4090 (platform 2.0) and an Arc A380 (platform 1.0): the parity matrix (9 formats by 4 option strings), the temporal-only command case, the graph rebuild, the in-graph reset through tools/hqdn3d_reset_test with an ocl:<platform>.<device> argument, the refusal of rgba and the planted luma strength of 4.5 all pass. A +1 on the temporal output in the vertical kernel fails 37 cases, and a kept temporal state across the size change fails the in-graph case. Truncating instead of rounding the normalized reads gives the same output on the 4090, the A380 and the CPU OpenCL runtime; the rounding is kept because the OpenCL specification allows an error in the normalized conversion."""
