status = "submitted"
upstream = "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/25053"
consumers = ["pelorus"]
origin = "found by the Pelorus GPU lane (CUDA frames through an independent Vulkan device and back to CUDA, Pelorus #296)"
notes = """
vulkan_export_to_cuda() kept the CUDA import of a Vulkan frame from the \
first CUDA context that exported it. A second CUDA context, derived \
from the Vulkan device with hwupload=derive_device=cuda after \
hwupload_cuda on its own device, reused those handles, and \
cuWaitExternalSemaphoresAsync() failed with CUDA_ERROR_INVALID_VALUE. \
Measured with the reproducer from the commit message on an RTX 4090 \
(driver 615.78.08), n9.0.2 plus 0001-0007: without this patch 3 of 3 \
runs exit 187 with that error and no frame; with it 3 of 3 runs write \
120 frames whose framemd5 equals the same pipeline without the GPU hop. \
The upstream pull request has the same diff (equal patch-id) on FFmpeg \
master ebfc9497f7; this patch is its n9.0.2 form. Fixes FFmpeg issue \
25052. Revised after the 2026-10-21 review of the pull request: the old \
CUDA frames context is released only after its context pop (it can hold \
the last reference to the device and its function table), the pop \
result is returned, and a failed import releases only the partial CUDA \
import instead of the frame's whole internal state. The upstream head \
and this patch have equal patch-id; measurements of the revision are in \
the pull request."""

[[exceptions]]
rule = "HISS-04"
path = "libavutil/hwcontext_vulkan.c"
function = "vulkan_export_to_cuda"
lines = 153
category = "D"
entered = "2026-10-18"
expires = "2027-02-15"
reason = "upstream function, 115 lines before the patch; the change inside it is part of FFmpeg PR 25053 under review, and splitting the function would change that form"
