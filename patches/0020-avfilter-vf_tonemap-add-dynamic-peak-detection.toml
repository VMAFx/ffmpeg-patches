origin = "part 5 of the Dolby Vision profile 5 tone-mapping series without libplacebo (ADR-0002, ADR-0003): dynamic peak detection in vf_tonemap"
notes = """
New options peak_detect (default 0) and threshold (default 0.2) in vf_tonemap. The detector ports libplacebo v7.360.1 (src/shaders/colorspace.c: pl_shader_detect_peak, measure_peak, update_peak_buf; LGPL-2.1-or-later notice in the file header): luminance PQ-encoded at 14 bits over 16x16 tiles, the 99.995th percentile of the histogram, IIR smoothing over about 20 frames, scene change window from 5 to 15 times threshold in percent of the average PQ level. A frame carrying lavfi.dovi.l1_max_pq from 0012 is not measured; its PQ-decoded level 1 peak is used, as libplacebo does with the RPU (vf_libplacebo gives identical output with peak_detect=1 and 0 on the profile 5 clip). scripts/tonemap_parity.py against vf_libplacebo hable with peak_detect=1: profile 5 clip of tests/fixtures/dv5 (dovi_reshape, zscale linear, tonemap=bt2408_hable:peak_detect=1, zscale bt709) mean CIEDE2000 0.868, p95 3.327; 2160p HDR10 clip mean 0.546, p95 1.244, against 0.746 without peak detection (ADR-0002 bar 2.3). A planted fixed peak of 4000 cd/m^2 fails both at 5.275 and 4.816. Wall time 2.6 s against 2.1 s for libplacebo at 720p, 38.6 s against 3.4 s at 2160p on the CPU. make fate-filter-tonemap-peak-detect checks the level 1 peak, the measured peak of a flat clip and the reset on a scene change, each with a planted wrong case (wrong level 1 code, 4x peak, threshold=0 keeping the history); a detector that returns its peak 2 percent high fails two of the six lines. With peak_detect=0 the output is byte-identical to 0019 on RGB and YUV input, and the filter-tonemap-bt2408-hable, filter-dovi-reshape and filter-dovi-reshape-graph references are unchanged. No version.h or Changelog bump."""
