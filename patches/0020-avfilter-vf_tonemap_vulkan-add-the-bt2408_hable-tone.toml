origin = "part 4 of the Dolby Vision profile 5 tone-mapping series without libplacebo (ADR-0002): a new tonemap_vulkan filter with the bt2408_hable curve in a compute shader"
notes = """
New filter tonemap_vulkan. The host fills the 0013 FFBT2408Hable state into a storage buffer, rewritten only when the peak or the primaries change and after the queued work has finished; vulkan/bt2408_hable.comp.glsl ports opencl/bt2408_hable.cl. Input P010 with PQ and BT.2020 limited range only, anything else is refused with an error; output BT.709 limited range NV12 (default) or P010, light-level and mastering side data removed. Options tonemap (bt2408_hable only), peak (0 = from the frame metadata), format. scripts/tonemap_parity.py against vf_libplacebo hable, RTX 4090: profile 5 clip of tests/fixtures/dv5 mean CIEDE2000 1.01, p95 3.383; 2160p HDR10 clip mean 0.721, p95 1.329 (ADR-0002 bar 2.3). A planted fixed peak of 4000 cd/m^2 fails both at 5.124 and 4.781. Wall time of the run: 1.77 s against 1.52 s for vf_libplacebo on DV5 720p, 3.12 s against 3.27 s on HDR10 2160p. Memory above idle: 103 MiB against 236 MiB at 720p, 1270 MiB against 592 MiB at 2160p. tests/test_tonemap_vulkan.py matches the CPU path within one 8-bit code value on five flat colours, refuses a planted peak of 4000 cd/m^2 and checks the refusal of HLG input; it passes on the RTX 4090 and the Arc A380. Dropping the output gamma in the shader fails four cases. No version.h or Changelog bump."""
