consumers = ["pelorus"]
origin = "found by the Pelorus GPU lane (Vulkan to VAAPI DRM-modifier mapping, Pelorus #103)"
notes = """
Vulkan exports the R16G16 chroma plane of P010/P012 as GR1616 \
(vulkan_fmt_to_drm() takes the first match; GR1616 is listed before \
RG1616), and the VAAPI DRM import table only knew RG1616. Shown on an \
Arc A380 and a Ryzen 9 9950X3D iGPU (RAPHAEL_MENDOCINO) in a build that also waited on the CPU before \
the map. With this patch alone (n9.0.2 plus 0001-0005), P010 and P012 \
frames survive a VAAPI to DRM to VAAPI round trip bit-exact on both \
GPUs (iHD and radeonsi, 10 frames each), and the distribution's n9.0.2 \
build refuses the import with EINVAL. FFmpeg master ba987fe24d has the same table. The \
Radeon read-back race is a separate defect, fixed by 0007."""
