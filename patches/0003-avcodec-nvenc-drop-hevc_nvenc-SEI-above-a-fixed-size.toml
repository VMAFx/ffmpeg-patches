notes = """
Already on FFmpeg master; release/9.0 does not carry it (checked \
2026-10-25 against release/9.0 9a9b70bb8c). Drop the patch once the \
pinned base contains the commit. It applies to n9.0.2 unchanged. \
hevc_nvenc drops a SEI that would take the payload bytes of a picture \
above 512, with one warning. It replaces the earlier form of the series \
(the SEI budget, the rule for payloads that NVENC writes truncated, and \
the nvenc_sei.h header), which FFmpeg did not take; the truncation rule moves \
into Pelorus 0022. FFmpeg master has no rule for zero-heavy payloads \
and still writes those truncated."""
