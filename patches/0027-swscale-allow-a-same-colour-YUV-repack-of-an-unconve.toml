origin = "#63 Dolby Vision profile 5 reshape (ADR-0002), part 1 of the tonemap_opencl reshape: the P010 repack of an IPT-C2 base layer before hwupload"
notes = """
sws_frame_setup() accepts a frame whose colour space it cannot convert when both sides are YUV formats with at least three components that agree in colour space, range, primaries and transfer (ff_fmt_same_color() in format.h; the chroma location may differ); the format test is repeated with BT.2020 NCL standing in for the colour space so every other check still runs. Gamma-correct scaling gets no stand-in, as it converts through RGB with the colour matrix. sws_test_colorspace() stays as in FFmpeg. The helper test_frame_fmt() sits above validate_params() and the call site in sws_frame_setup() changes only its if line, so the patch applies with exact context on n9.0.2 and applies on FFmpeg master. Round 3, measured with testsrc2 IPT-C2 probes on minimal n9.0.2 and FFmpeg master (c02ac4a) builds with this series: format=p010, format=yuv420p, scale=48:32 and scale=out_chroma_loc=topleft,format=p010 pass; format=p010,format=yuv420p10le is framemd5-identical to the plain source; format=gbrp10, format=rgb48le, format=gray10le, scale=out_range=pc, scale=out_color_matrix=bt709 and scale=48:32:gamma=1 are refused (rc 161, Unsupported input), while the BT.2020 NCL controls of format=gray10le and scale=48:32:gamma=1 pass. fate-libswscale and the FATE tests matching scale, sws, colorspace or setparams pass on both builds; fate-sws-slice-bgr0-nv12 and fate-sws-slice-yuv422-12bit-rgb48 did not run, as they need the FATE samples. Round 1, measured on the 1280x720 profile 5 clip of #63 with a minimal n9.0.2 build: format=gbrp10, format=rgb48le, scale=out_color_matrix=bt709 and scale=out_range=tv are refused (rc 161, Unsupported input) where the build without this series refuses them in negotiation (rc 218); format=p010 and format=yuv420p pass; format=p010,format=yuv420p10le is framemd5-identical to the plain decode on all 96 frames. testsrc2 through (yuv420p,nv12), (yuv420p10le,p010le), (yuv420p,rgb24) and (rgb24,yuv420p) is hash-identical to the build without this series."""
