status = "submitted"
upstream = "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/25110"
consumers = ["pelorus"]
origin = "found by the Pelorus GPU lane (Vulkan to VAAPI DRM-modifier mapping, Pelorus #103)"
notes = """
RADV allocates exportable memory with AMDGPU_GEM_CREATE_EXPLICIT_SYNC \
(Mesa 26.2.4 and main, radv_amdgpu_bo.c), and amdgpu skips the \
reservation fences of an explicitly synchronized buffer for every \
submission on it, including a radeonsi importer of the same buffer \
object (Linux 7.2 amdgpu_cs.c, amdgpu_sync.c). The sync file \
vulkan_map_to_drm() attaches to the dma-buf is therefore never waited \
for by VAAPI GPU work on RADV. Measured: a RADV dma-buf reports \
alloc_flags 0x28e (EXPLICIT_SYNC set). On a Ryzen 9 9950X3D iGPU \
(Mesa 26.2.4, Linux 7.2.9), 12 to 15 of 20 mapped frames differed from a \
Vulkan readback without this patch and 0 of 20 with it, in three \
repetitions each. RADV no longer imports a sync file (21 imports per \
run before, 0 after); ANV with iHD on an Arc A380 keeps the sync file \
path (63 imports per run either way) and matches in both builds. The \
exported sync file is still pending at hand-off in every frame, and \
waiting on it on the CPU also removes the race, so the fence is correct \
and only ignored. FFmpeg master ba987fe24d has the same map path."""

[[exceptions]]
rule = "HISS-04"
path = "libavutil/hwcontext_vulkan.c"
function = "vulkan_map_to_drm"
lines = 169
category = "D"
entered = "2026-10-18"
expires = "2027-02-15"
reason = "upstream function, 163 lines before the patch; the change inside it is part of FFmpeg PR 25110 under review, and splitting the function would change that form"
