origin = "part 1 of hqdn3d on the GPU bit-exact to the CPU filter (ADR-0004): a new hqdn3d_vulkan filter in two compute shaders"
notes = """
New filter hqdn3d_vulkan with the options and commands of hqdn3d (luma_spatial, chroma_spatial, luma_tmp, chroma_tmp). The lookup tables and default strengths move from vf_hqdn3d.c into hqdn3d_coefs.c, which both filters use; hqdn3d itself is otherwise unchanged and fate-filter-hqdn3d passes. The new files carry the GPL header of vf_hqdn3d.c, from which the tables and the algorithm come, and the filter depends on --enable-gpl as hqdn3d does; configure without it disables the filter. Measured on an RTX 4090, an Arc A380 and a Radeon iGPU (RADV): the output matches hqdn3d sample for sample on 1920x1080 and 1279x719 noise with default and changed strengths and after a sendcmd that turns the spatial filter off, in yuv420p, yuv420p10, yuv444p12, yuv444p16, nv12 and p010 (72 of 72 framemd5 cases), and on white and black frames and strengths 254 and 0.5. Where hqdn3d writes a value above the format maximum into a 12 bit plane (65535, when an intermediate value turns negative), p012 cannot store it and the Vulkan filter writes 4095; doc/filters.texi says so. The temporal state is dropped where hqdn3d drops it: a graph rebuild on a resolution switch gives the same frames as hqdn3d, and after a frame size change inside a running graph the output takes the new size from a frames context of that size. tools/hqdn3d_reset_test checks the second case through the libavfilter API on 12 frames of three sizes. tests/test_hqdn3d_vulkan.py runs both on a device, with nine formats and four option sets; a +1 on the temporal output in the vertical shader fails it in 38 cases, and a kept temporal state across the size change fails the in-graph case."""
