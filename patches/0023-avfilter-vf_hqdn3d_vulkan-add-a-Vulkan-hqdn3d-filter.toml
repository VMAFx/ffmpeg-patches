origin = "part 1 of hqdn3d on the GPU bit-exact to the CPU filter (ADR-0004): a new hqdn3d_vulkan filter in two compute shaders"
notes = """
New filter hqdn3d_vulkan with the options and commands of hqdn3d (luma_spatial, chroma_spatial, luma_tmp, chroma_tmp). The lookup tables and default strengths move from vf_hqdn3d.c into hqdn3d_coefs.c, which both filters use; hqdn3d itself is otherwise unchanged and fate-filter-hqdn3d passes. The new files carry the GPL header of vf_hqdn3d.c, from which the tables and the algorithm come, and the filter depends on --enable-gpl as hqdn3d does; configure without it disables the filter. Measured on an RTX 4090, an Arc A380 and a Radeon iGPU (RADV): the output matches hqdn3d sample for sample on 1920x1080 and 1279x719 noise with default and changed strengths and after a sendcmd that turns the spatial filter off, in yuv420p, yuv420p10, yuv444p12, yuv444p16, nv12 and p010 (72 of 72 framemd5 cases), and on white and black frames and strengths 254 and 0.5. Where hqdn3d writes a value above the format maximum into a 12 bit plane (65535, when an intermediate value turns negative), p012 cannot store it and the Vulkan filter writes 4095; doc/filters.texi says so. The temporal state is dropped where hqdn3d drops it: a graph rebuild on a resolution switch gives the same frames as hqdn3d, and after a frame size change inside a running graph the output takes the new size from a frames context of that size. libavfilter/tests/hqdn3d_vulkan checks the second case through the libavfilter API on 12 frames of three sizes. tests/test_hqdn3d_vulkan.py runs both on a device, with nine formats and four option sets; a +1 on the temporal output in the vertical shader fails it in 38 cases, and a kept temporal state across the size change fails the in-graph case. Sent upstream as FFmpeg pull request 25879 on 2026-11-09, in three commits: the table move, the filter and a FATE test. master_form records its head, de601453 (pushed 2026-11-21) on master 9ced9e345c, which contains the CPU mask of patch 0045; that head adds three Forgejo Fairy review fixes to the 2026-11-20 rebase (where both shaders mask a loaded sample to its depth before the shift and the test adds a case with samples above the depth, after the rebase of 2026-11-18 had changed only the Changelog context and the place of the doc/filters.texi section, now before nlmeans_vulkan): both shaders use literal workgroup sizes (1x32 and 32x1) instead of specializing local_size_x_id, local_size_y_id and local_size_z_id, check_frame_views refuses with AVERROR(ENOTSUP) an input or output frame pool that does not allow mutable-format storage images or unsigned integer storage image views for every plane, and init_filter checks maxPerStageDescriptorStorageImages >= 2 * planes before building either pipeline, with doc/filters.texi documenting both requirements; this patch carries the content of that head as one patch for the 9.0 release, with those three changes, the shader mask, the above-depth case moved to patch 0046 after the CPU mask, and these review fixes: the filter declares FF_FILTER_FLAG_DYNAMIC_FRAME_SIZE, which FFmpeg master needs to pass a resized frame into a running graph, and defines it as 0 on a release without it, such as 9.0, and the filter gives a first frame whose size differs from the link an output frames context of the frame size; a frame whose pixel format differs from the link, the first frame included, is refused with AVERROR(EINVAL); the horizontal shader no longer binds the temporal history buffer it does not read; the error of ff_vk_exec_start() is returned, and a failed barrier or dispatch setup discards the execution context; a device without shaderInt16, shaderStorageImageReadWithoutFormat, shaderStorageImageWriteWithoutFormat, storageBuffer16BitAccess or scalarBlockLayout, or a buffer above maxStorageBufferRange, is refused with AVERROR(ENOTSUP); the p010 and p012 store clamps to the format maximum before the shift; both shaders clamp the coefficient index to the lookup table; a planar output sample is narrowed to the width of its 8 or 16 bit container, so a temporal result below zero is stored as hqdn3d stores it; a failed initialization, or a failed reallocation after a frame size change, is final, and the filter returns its error for every later frame and command; in the master form each execution waits on the device for the timeline semaphore of the previous successful execution before its compute shaders read the temporal history; the 9.0 release has no timeline semaphore on FFVkExecContext, so this patch records every frame on one execution context, makes the previous frame's history writes visible to the compute shaders with a buffer memory barrier and waits on the host after each submission, and after a failed start, a recording that is not submitted or a failed submission, it replaces the context fence, which is then unsignalled and not pending, with a new signalled fence, so the next start and the free on that context do not wait forever; when the new fence cannot be created, the filter error is final and the free skips the wait on the old fence; tests/test_hqdn3d_vulkan_fault.py injects these failures with a Vulkan layer; doc/filters.texi names the planar CPU format as the reference for semiplanar input and the device features the filter requires to be enabled, and the master form lists the filter in the Changelog, which this patch leaves alone. The reset driver is libavfilter/tests/hqdn3d_vulkan.c, run as fate-filter-hqdn3d-vulkan under fate-hw; on a Vulkan device it prints 21 lines and also checks the first-frame size change, the format-change refusal, the p012 clamp and a temporal result below zero in two 2x2 yuv420p12 frames, and exits with a nonzero status when a step fails or a compared frame differs from the CPU filter; the shaders now size their storage-image arrays to the frame's plane count through a specialization constant, so a semiplanar format declares as many storage images as its pipeline layout binds and the validation layer no longer reports VUID-VkComputePipelineCreateInfo-layout-07991, and the final branch reads the last plane by that count. The format-change and first-frame refusal steps of the test program fail the run with AVERROR_BUG when the filter accepts the change and return a refusal error other than AVERROR(EINVAL), so the yuv444p step after an accepted yuv420p10 change is never reached, and the p012 step fails it with AVERROR_BUG unless frame 0 spans 0 to 0xFFF0, frames 1 and 2 are 0xFFF0 throughout and no low bit is set; these checks and the zero fallback of the flag are not in the 25879 head and go upstream in a follow-up pull request after 25879 merges. fate-filter-hqdn3d-vulkan sits in FFmpeg's FATE_HW list, so a default make fate leaves it out; it needs a Vulkan device and exits nonzero without one in a run of the fate-list targets, which also list the hardware tests, so series.yml removes it from its fate-list targets and runs it, with the in-graph reset cases, on lavapipe."""

