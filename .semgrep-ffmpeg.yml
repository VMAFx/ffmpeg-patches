# Semgrep rules for FFmpeg C sources, run by the c-rules step of
# scripts/upstream_lint.py through scripts/semgrep_scan.sh over changed files.
rules:
  # After ff_rtsp_connect() succeeds, every teardown exit must call ff_network_close()
  # to balance its network init (review of upstream FFmpeg pull request 25618, November 2026).
  - id: ffmpeg-rtsp-connect-failure-without-network-close
    languages: [c]
    severity: ERROR
    message: >-
      ff_rtsp_connect() leaves ff_network_init() active once it succeeds; call
      ff_network_close() after ff_rtsp_close_connections() before returning.
    patterns:
      - pattern-inside: |
          $RET $FUNC(...) {
            ...
            <... ff_rtsp_connect(...) ...>;
            ...
          }
      - pattern: |
          ff_rtsp_close_connections(...);
          ...
          return ...;
      - pattern-not: |
          ff_rtsp_close_connections(...);
          ...
          ff_network_close(...);
          ...
          return ...;

  # Derive pointers after checking allocation results; NULL ternaries add no value
  # (review of upstream FFmpeg pull request 25480, November 2026).
  - id: ffmpeg-null-ternary-after-allocation
    languages: [c]
    severity: ERROR
    message: >-
      The allocation is checked anyway; check it first and derive the pointer
      after the check instead of using a ternary with a NULL fallback.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $BUF_TYPE *$BUF = $ALLOC(...);
                      ...
                      $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
                      ...
                      if ($CHECK) {
                        ...
                      }
                  - pattern-inside: |
                      $BUF_TYPE *$BUF = $ALLOC(...);
                      ...
                      $DST = $BUF ? $VALUE : NULL;
                      ...
                      if ($CHECK) {
                        ...
                      }
                  - pattern-inside: |
                      $BUF = $ALLOC(...);
                      ...
                      $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
                      ...
                      if ($CHECK) {
                        ...
                      }
                  - pattern-inside: |
                      $BUF = $ALLOC(...);
                      ...
                      $DST = $BUF ? $VALUE : NULL;
                      ...
                      if ($CHECK) {
                        ...
                      }
              - metavariable-pattern:
                  metavariable: $CHECK
                  pattern-either:
                    - pattern: '!$BUF'
                    - pattern: '$BUF == NULL'
                    - pattern: '... || !$BUF || ...'
                    - pattern: '... || $BUF == NULL || ...'
                    - pattern: '!$DST'
                    - pattern: '$DST == NULL'
                    - pattern: '... || !$DST || ...'
                    - pattern: '... || $DST == NULL || ...'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $BUF_TYPE *$BUF = $ALLOC(...);
                      ...
                      if ($CHECK) {
                        ...
                      }
                      ...
                      $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
                  - pattern-inside: |
                      $BUF_TYPE *$BUF = $ALLOC(...);
                      ...
                      if ($CHECK) {
                        ...
                      }
                      ...
                      $DST = $BUF ? $VALUE : NULL;
                  - pattern-inside: |
                      $BUF = $ALLOC(...);
                      ...
                      if ($CHECK) {
                        ...
                      }
                      ...
                      $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
                  - pattern-inside: |
                      $BUF = $ALLOC(...);
                      ...
                      if ($CHECK) {
                        ...
                      }
                      ...
                      $DST = $BUF ? $VALUE : NULL;
              - metavariable-pattern:
                  metavariable: $CHECK
                  pattern-either:
                    - pattern: '!$BUF'
                    - pattern: '$BUF == NULL'
                    - pattern: '... || !$BUF || ...'
                    - pattern: '... || $BUF == NULL || ...'
      - pattern-either:
          - pattern: |
              $BUF_TYPE *$BUF = $ALLOC(...);
              ...
              $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
          - pattern: |
              $BUF_TYPE *$BUF = $ALLOC(...);
              ...
              $DST = $BUF ? $VALUE : NULL;
          - pattern: |
              $BUF = $ALLOC(...);
              ...
              $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
          - pattern: |
              $BUF = $ALLOC(...);
              ...
              $DST = $BUF ? $VALUE : NULL;
      - metavariable-regex:
          metavariable: $ALLOC
          regex: ^(av_malloc|av_mallocz|av_malloc_array|av_calloc|av_realloc|av_realloc_array|av_memdup|malloc|calloc|realloc)$
      # Filter complete source-to-ternary ranges before focusing the destination.
      # A later allocation starts a new range with no intervening write.
      - pattern-not: |
          $BUF_TYPE *$BUF = $ALLOC(...);
          ...
          $BUF = $OTHER;
          ...
          $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
      - pattern-not: |
          $BUF_TYPE *$BUF = $ALLOC(...);
          ...
          $BUF = $OTHER;
          ...
          $DST = $BUF ? $VALUE : NULL;
      - pattern-not: |
          $BUF = $ALLOC(...);
          ...
          $BUF = $OTHER;
          ...
          $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
      - pattern-not: |
          $BUF = $ALLOC(...);
          ...
          $BUF = $OTHER;
          ...
          $DST = $BUF ? $VALUE : NULL;
      - focus-metavariable: $DST
