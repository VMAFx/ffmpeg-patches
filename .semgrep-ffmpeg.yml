#
# Semgrep rules for FFmpeg C sources, run by the c-rules step of
# scripts/upstream_lint.py through scripts/semgrep_scan.sh over changed files.
rules:
  # After ff_rtsp_connect() succeeds, every teardown exit must call ff_network_close()
  # to balance its network init (review of upstream FFmpeg pull request 25618, November 2026).
  - id: ffmpeg-rtsp-connect-failure-without-network-close
    languages: [c]
    severity: ERROR
    message: >-
      ff_rtsp_connect() leaves ff_network_init() active once it succeeds; call
      ff_network_close() after ff_rtsp_close_connections() before returning.
    patterns:
      - pattern-inside: |
          $RET $FUNC(...) {
            ...
            <... ff_rtsp_connect(...) ...>;
            ...
          }
      - pattern: |
          ff_rtsp_close_connections(...);
          ...
          return ...;
      - pattern-not: |
          ff_rtsp_close_connections(...);
          ...
          ff_network_close(...);
          ...
          return ...;

  # Derive pointers after checking allocation results; NULL ternaries add no value
  # (review of upstream FFmpeg pull request 25480, November 2026).
  - id: ffmpeg-null-ternary-after-allocation
    languages: [c]
    severity: ERROR
    message: >-
      The allocation is checked anyway; check it first and derive the pointer
      after the check instead of using a ternary with a NULL fallback.
    patterns:
      - pattern-inside: |
          $RET $FUNC(...) {
            ...
          }
      - pattern-either:
          - pattern-inside: |
              $BUF_TYPE *$BUF = $ALLOC(...);
              ...
          - pattern-inside: |
              $BUF = $ALLOC(...);
              ...
      - metavariable-regex:
          metavariable: $ALLOC
          regex: ^(av_malloc|av_mallocz|av_malloc_array|av_calloc|av_realloc|av_realloc_array|av_memdup|malloc|calloc|realloc)$
      - pattern-either:
          - pattern: |
              $DST_TYPE *$DST = $BUF ? $VALUE : NULL;
          - pattern: |
              $DST = $BUF ? $VALUE : NULL;
