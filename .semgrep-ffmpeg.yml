# Semgrep rules for FFmpeg C sources, run by the c-rules step of
# scripts/upstream_lint.py through scripts/semgrep_scan.sh over changed files.
rules:
  # After ff_rtsp_connect() succeeds, every teardown exit must call ff_network_close()
  # to balance its network init (review of upstream FFmpeg pull request 25618, November 2026).
  - id: ffmpeg-rtsp-connect-failure-without-network-close
    languages: [c]
    severity: ERROR
    message: >-
      ff_rtsp_connect() leaves ff_network_init() active once it succeeds; call
      ff_network_close() after ff_rtsp_close_connections() before returning.
    patterns:
      - pattern-inside: |
          $RET $FUNC(...) {
            ...
            <... ff_rtsp_connect(...) ...>;
            ...
          }
      - pattern: |
          ff_rtsp_close_connections(...);
          ...
          return ...;
      - pattern-not: |
          ff_rtsp_close_connections(...);
          ...
          ff_network_close(...);
          ...
          return ...;

  # Derive pointers after checking allocation results (review of upstream FFmpeg pull request 25480, November 2026):
  # in one function, a pointer from an allocation call feeds a NULL-fallback ternary with no
  # earlier if directly testing the allocated pointer for NULL or non-NULL, including
  # a direct test as a whole AND/OR operand, followed by a NULL check of the pointer or destination.
  # - use-before-check: reported by plain shape
  # - log-only-later-check: reported by plain shape
  # - stale-later-check: reported by plain shape
  # - macro-assertion-before-ternary: reported by plain shape
  # - reassigned-buffer-before-ternary: reported by plain shape
  # - earlier-destination-check: not seen
  # - second-ternary: reported by plain shape
  # - conditional-early-check: not seen
  # - earlier-allocation-check: not seen
  # - goto-into-ternary: not seen
  # - unbraced-inner-loop-break: not seen
  # Pinned in tests/test_semgrep_rules.py.
  - id: ffmpeg-null-ternary-after-allocation
    languages: [c]
    severity: ERROR
    message: >-
      The allocation is checked anyway; check it first and derive the pointer
      after the check instead of using a ternary with a NULL fallback. This
      rule reports only functions with no earlier if directly testing the allocated
      pointer for NULL/non-NULL before the ternary and does not follow control or data
      flow or expand assertion macros.
    patterns:
      - pattern-either:
          - pattern-inside: |
              $BUF_TYPE *$BUF = $ALLOC(...);
              ...
              $DST_TYPE *$DST = $TERNARY;
              ...
              if ($CHECK) {
                ...
              }
          - pattern-inside: |
              $BUF_TYPE *$BUF = $ALLOC(...);
              ...
              $DST = $TERNARY;
              ...
              if ($CHECK) {
                ...
              }
          - pattern-inside: |
              $BUF = $ALLOC(...);
              ...
              $DST_TYPE *$DST = $TERNARY;
              ...
              if ($CHECK) {
                ...
              }
          - pattern-inside: |
              $BUF = $ALLOC(...);
              ...
              $DST = $TERNARY;
              ...
              if ($CHECK) {
                ...
              }
      - metavariable-regex:
          metavariable: $ALLOC
          regex: ^(av_malloc|av_mallocz|av_malloc_array|av_calloc|av_realloc|av_realloc_array|av_memdup|malloc|calloc|realloc)$
      - metavariable-pattern:
          metavariable: $CHECK
          pattern-either:
            - pattern: '!$BUF'
            - pattern: '$BUF == NULL'
            - pattern: 'NULL == $BUF'
            - pattern: '... || !$BUF || ...'
            - pattern: '... || $BUF == NULL || ...'
            - pattern: '... || NULL == $BUF || ...'
            - pattern: '!$DST'
            - pattern: '$DST == NULL'
            - pattern: 'NULL == $DST'
            - pattern: '... || !$DST || ...'
            - pattern: '... || $DST == NULL || ...'
            - pattern: '... || NULL == $DST || ...'
      - pattern-either:
          - pattern: '$DST_TYPE *$DST = $BUF ? $VALUE : NULL;'
          - pattern: '$DST = $BUF ? $VALUE : NULL;'
          - pattern: '$DST_TYPE *$DST = !$BUF ? NULL : $VALUE;'
          - pattern: '$DST = !$BUF ? NULL : $VALUE;'
          - pattern: '$DST_TYPE *$DST = $BUF != NULL ? $VALUE : NULL;'
          - pattern: '$DST = $BUF != NULL ? $VALUE : NULL;'
          - pattern: '$DST_TYPE *$DST = NULL != $BUF ? $VALUE : NULL;'
          - pattern: '$DST = NULL != $BUF ? $VALUE : NULL;'
          - pattern: '$DST_TYPE *$DST = $BUF == NULL ? NULL : $VALUE;'
          - pattern: '$DST = $BUF == NULL ? NULL : $VALUE;'
          - pattern: '$DST_TYPE *$DST = NULL == $BUF ? NULL : $VALUE;'
          - pattern: '$DST = NULL == $BUF ? NULL : $VALUE;'
      # Bind allocation and whole if condition in the same pattern, including nested ifs.
      - pattern-not-inside:
          pattern-either:
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if ($BUF) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (!$BUF) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if ($BUF == NULL) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (NULL == $BUF) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if ($BUF != NULL) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (NULL != $BUF) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && $BUF && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && !$BUF && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && $BUF == NULL && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && NULL == $BUF && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && $BUF != NULL && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && NULL != $BUF && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || $BUF || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || !$BUF || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || $BUF == NULL || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || NULL == $BUF || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || $BUF != NULL || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || NULL != $BUF || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if ($BUF) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (!$BUF) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if ($BUF == NULL) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (NULL == $BUF) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if ($BUF != NULL) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (NULL != $BUF) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && $BUF && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && !$BUF && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && $BUF == NULL && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && NULL == $BUF && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && $BUF != NULL && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... && NULL != $BUF && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || $BUF || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || !$BUF || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || $BUF == NULL || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || NULL == $BUF || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || $BUF != NULL || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$EARLY_TYPE *$BUF = ...; ... if (... || NULL != $BUF || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if ($BUF) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (!$BUF) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if ($BUF == NULL) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (NULL == $BUF) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if ($BUF != NULL) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (NULL != $BUF) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && $BUF && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && !$BUF && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && $BUF == NULL && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && NULL == $BUF && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && $BUF != NULL && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && NULL != $BUF && ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || $BUF || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || !$BUF || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || $BUF == NULL || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || NULL == $BUF || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || $BUF != NULL || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || NULL != $BUF || ...) { ... } ... $DST_TYPE *$DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if ($BUF) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (!$BUF) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if ($BUF == NULL) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (NULL == $BUF) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if ($BUF != NULL) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (NULL != $BUF) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && $BUF && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && !$BUF && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && $BUF == NULL && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && NULL == $BUF && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && $BUF != NULL && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... && NULL != $BUF && ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || $BUF || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || !$BUF || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || $BUF == NULL || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || NULL == $BUF || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || $BUF != NULL || ...) { ... } ... $DST = $TERNARY;'
            - pattern: '$BUF = ...; ... if (... || NULL != $BUF || ...) { ... } ... $DST = $TERNARY;'
      - focus-metavariable: $TERNARY
